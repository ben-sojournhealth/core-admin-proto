<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Claims Works</title>
<link rel="stylesheet" href="/shared/interfaces.css">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #687384; --line: #e2e6ec;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e3f3f1;
  --amber: #8a5a00; --amber-soft: #fff4d9; --amber-line: #f2d48b;
  --red: #b42318; --red-soft: #fdecea; --green: #157347; --green-soft: #e2f4ea; --gray-soft: #edf0f3;
  --blue: #1d4ed8; --blue-soft: #e6edff;
  --code: #f3f5f8; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  /* the shared interface panel's tokens */
  --accent: var(--blue); --proto: var(--brand); --proto-soft: var(--brand-soft);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --panel: #171c22; --ink: #e6eaef; --muted: #93a0b0; --line: #262e37;
    --brand: #2dd4bf; --brand-ink: #062320; --brand-soft: #123532;
    --amber: #f3c969; --amber-soft: #2e2611; --amber-line: #5c4a1c;
    --red: #ff8f85; --red-soft: #3a1d1b; --green: #6fdc9f; --green-soft: #15301f; --gray-soft: #232a33;
    --blue: #93b4ff; --blue-soft: #1a2440;
    --code: #12171c; --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
a { color: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.top { height: 50px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.top b { font-size: 15px; }
.top .sub { color: var(--muted); }
.top .right { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.top .right a { text-decoration: none; } .top .right a:hover { color: var(--brand); }
.stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 26px 24px; }
.slide { width: 100%; max-width: 1160px; }
.slide h1 { font-size: 30px; letter-spacing: -.02em; margin: 0 0 6px; }
.slide .lede { color: var(--muted); font-size: 17px; margin: 0 0 20px; max-width: 860px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); margin-bottom: 8px; }
.kicker.plan { color: var(--amber); }
.bar { height: 52px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-top: 1px solid var(--line); background: var(--panel); }
.bar button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.bar button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.bar button:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); cursor: pointer; }
.dots i.on { background: var(--brand); }
.dots i.plan { outline: 1.5px dashed var(--amber); outline-offset: 1px; }
.count { margin-left: auto; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 900px) { .grid2, .cols3 { grid-template-columns: 1fr; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.box h3 { margin: 0 0 6px; font-size: 15px; }
.box p { margin: 0; color: var(--muted); font-size: 14px; }
.box.planned { border-style: dashed; border-color: var(--amber-line); box-shadow: none; background: transparent; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-top: 4px; }
.note { margin-top: 16px; padding: 11px 16px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 0 10px 10px 0; font-size: 15px; }
.note.warn { border-color: var(--amber); background: var(--amber-soft); }
.chip { display: inline-block; font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; border-radius: 999px; padding: 1px 9px; background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
.chip.APPROVED, .chip.CLEARED, .chip.PAYABLE, .chip.ok { background: var(--green-soft); color: var(--green); }
.chip.DENIED, .chip.RETURNED, .chip.bad { background: var(--red-soft); color: var(--red); }
.chip.PENDED, .chip.SELECTED, .chip.PARTIALLY_DENIED, .chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.ISSUED, .chip.ADJUDICATED, .chip.info { background: var(--blue-soft); color: var(--blue); }
.chip.superseded { background: transparent; border: 1px dashed var(--muted); }
.chip.dry { background: transparent; border: 1px dashed var(--muted); }
.live { font-size: 12px; color: var(--green); font-weight: 600; }
.live::before { content: "●"; margin-right: 5px; }

/* flow */
.flow { display: flex; align-items: stretch; flex-wrap: wrap; }
.flow .node { flex: 1; min-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.flow .node.hl { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.flow .node.planned { border-style: dashed; border-color: var(--amber-line); background: transparent; }
.flow .node b { display: block; font-size: 16px; margin-bottom: 4px; }
.flow .node span { color: var(--muted); font-size: 13.5px; }
.flow .arrow { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 8px; color: var(--muted); font-size: 12px; min-width: 62px; text-align: center; }
.flow .arrow::before { content: "→"; font-size: 24px; color: var(--brand); }
.flow.plan .arrow::before { color: var(--amber); }

/* state tracks */
.tracks { display: grid; grid-template-columns: 190px 1fr; gap: 10px 14px; align-items: center; margin-top: 18px; }
.tracks .lab { font-weight: 650; font-size: 14px; } .tracks .lab small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.states { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.states .sep { color: var(--muted); }
.states .sep.when { font-size: 12.5px; font-style: italic; }

/* endpoints */
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; align-items: start; }
.group h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ep { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1.5px solid var(--brand); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.ep:hover { box-shadow: 0 0 0 3px var(--brand-soft); }
.ep b { font: 650 13.5px ui-monospace, SFMono-Regular, Menlo, monospace; display: block; }
.ep span.does { color: var(--muted); font-size: 13px; display: block; margin: 2px 0 6px; }
.ep.unbuilt { border-style: dashed; border-color: var(--muted); }
.ep .tags { display: flex; gap: 5px; flex-wrap: wrap; }

/* claim cards */
.claims { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.claim { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 200px; flex: 1; max-width: 290px; }
.claim.gone { opacity: .62; }
.claim.new { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.claim .num { font: 650 13.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
.claim .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.claim .what { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.claim .money { font-size: 13px; margin-top: 6px; } .claim .money b { font-size: 15px; }
.claim .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; width: 76px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }

/* outcomes */
.outcomes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
@media (max-width: 900px) { .outcomes { grid-template-columns: 1fr 1fr; } }
.outcomes .ln { display: grid; grid-template-columns: 60px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }

/* player */
.player { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .player { grid-template-columns: 1fr; } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.steps button { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; cursor: pointer; display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; }
.steps button:hover { border-color: var(--brand); }
.steps button.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.steps .n { color: var(--muted); font-size: 12px; padding-top: 2px; }
.steps .l { font-size: 13.5px; }
.steps .e { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.kind { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 6px; padding: 1px 7px; background: var(--brand-soft); color: var(--brand); }
.kind.standin, .kind.setup { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.kind.remittance { background: var(--blue-soft); color: var(--blue); }
.after h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.refusal { padding: 10px 14px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 14px; margin-bottom: 10px; }
.log { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.log li { padding: 3px 0 3px 14px; position: relative; } .log li::before { content: "·"; position: absolute; left: 3px; }
details.wire { margin-top: 10px; font-size: 13px; }
details.wire summary { cursor: pointer; color: var(--muted); }
details.wire pre { margin: 6px 0 0; padding: 10px 12px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 300px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.deltabox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--code); margin-bottom: 10px; font-size: 14px; }
.deltabox b { font-size: 17px; }

/* model */
.model { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .model { grid-template-columns: 1fr; } }
.record { border: 2px solid var(--ink); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.record > .ttl { grid-column: 1 / -1; font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
.fg { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--panel); }
.fg.wide { grid-column: 1 / -1; }
.fg h4 { margin: 0; font-size: 14px; } .fg small { color: var(--muted); font-size: 12px; display: block; margin-bottom: 7px; }
.fields { display: flex; flex-wrap: wrap; gap: 5px; }
.f { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); background: var(--code); color: var(--ink); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.f.msg { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.f.on { outline: 2px solid var(--brand); }
.fdoc { margin-top: 10px; min-height: 64px; font-size: 13.5px; color: var(--muted); padding: 10px 14px; border-radius: 10px; background: var(--code); white-space: pre-line; }
.fdoc b { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
details.tbl { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 6px; }
details.tbl summary { cursor: pointer; padding: 7px 11px; display: flex; gap: 8px; align-items: baseline; }
details.tbl summary b { font: 650 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
details.tbl summary span { color: var(--muted); font-size: 12.5px; flex: 1; }
details.tbl .ix { padding: 0 11px 9px; font-size: 12.5px; color: var(--muted); }
details.tbl .ix div { margin-top: 6px; } details.tbl .ix b { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
.rows div { display: grid; grid-template-columns: 34px 1fr 62px; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.rows i { height: 12px; border-radius: 3px; background: var(--gray-soft); display: block; }
.rows .cur i { background: var(--brand); } .rows .cur { color: var(--ink); font-weight: 600; }

/* chains */
.chain { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; }
.chain .claim { max-width: 215px; min-width: 170px; }
.chain .lnk { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 6px; font-size: 11.5px; color: var(--muted); min-width: 64px; text-align: center; }
.chain .lnk::before { content: "→"; font-size: 22px; color: var(--brand); line-height: 1; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rules span { font-size: 13.5px; padding: 4px 12px; border-radius: 999px; background: var(--gray-soft); }
button.linkish { border: 0; background: none; color: var(--brand); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; margin-top: 10px; }

/* delta bars */
.dl { display: grid; grid-template-columns: 250px minmax(0, 1fr) 150px; gap: 12px 16px; align-items: center; }
.dl .dlh { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dl .lab b { display: block; font-size: 14.5px; } .dl .lab small { color: var(--muted); font-size: 12.5px; }
.dl .pair { display: grid; grid-template-columns: 140px 1fr 70px; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.dl .pair i { display: block; height: 14px; border-radius: 4px; background: var(--muted); min-width: 2px; }
.dl .pair i.proj { background: var(--brand); }
.dl .d { font-size: 17px; font-weight: 700; text-align: right; }
.dl .d.neg { color: var(--red); } .dl .d.pos { color: var(--green); }
.dl .d small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }

/* 835s */
.rem { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.rem.fail { border: 1.5px dashed var(--red); background: transparent; }
.rem h3 { margin: 0 0 2px; font-size: 14.5px; } .rem small { color: var(--muted); font-size: 12.5px; }
.rem table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.rem td { padding: 4px 0; border-top: 1px solid var(--line); } .rem td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.rem tr.net td { font-weight: 700; border-top: 2px solid var(--ink); font-size: 14.5px; }
.rem .neg { color: var(--red); }

/* proposal */
.lanes { display: grid; grid-template-columns: 92px 1fr; gap: 10px 12px; align-items: stretch; }
.lanes .lane { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.ledger td { padding: 5px 8px; border-bottom: 1px solid var(--line); } .ledger td.amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.ledger tr.net td { border-top: 2px solid var(--ink); font-weight: 700; }
.ledger .neg { color: var(--red); }
details.q { border: 1px dashed var(--amber-line); border-radius: 10px; margin-bottom: 6px; }
details.q summary { cursor: pointer; padding: 7px 12px; font-size: 14px; font-weight: 600; }
details.q p { margin: 0; padding: 0 12px 10px; color: var(--muted); font-size: 13.5px; }
.loading { color: var(--muted); padding: 80px; text-align: center; }
</style>
</head>
<body>
<div class="top"><b>How claims works</b><span class="mono sub">every example below just ran, through the real ClaimsService</span>
  <div class="right"><a href="/adjudication/">Adjudication</a><a href="/claims-lifecycle/">Lifecycle</a><a href="/remittance/">Remittance</a><a href="/journey/">Journey</a><a href="/">Domain map</a></div></div>
<div class="stage"><div class="slide" id="slide"><div class="loading">Running the examples…</div></div></div>
<div class="bar"><button id="prev">← Back</button><button id="next">Next →</button><div class="dots" id="dots"></div><span class="count" id="count"></span></div>
<script src="/shared/interfaces.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (c) => (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2 });
const signed = (c) => (c > 0 ? "+" : "") + usd(c);
const lower = (s) => String(s || "").toLowerCase().replace(/_/g, " ");
const SERVICE = "coreadmin.claims.v1.ClaimsService";
let T = null;
// Which call of each example is showing; the model field being explained.
const sel = { decide: 2, reopen: 3 };
let field = null;
let chainOpen = null;

const chip = (s, cls = s) => `<span class="chip ${esc(cls)}">${esc(lower(s))}</span>`;
const last = (ex) => ex.calls[ex.calls.length - 1];
const byNumber = (ex, n) => last(ex).claims.find((c) => c.number === n);

// ---------- pieces ----------

const KIND = { original: "claim", corrected: "replacement", void: "void" };
// A claim's state. prev: its state before the call, to mark what's new.
function claimCard(c, prev) {
  const gone = !!c.superseded;
  const changed = prev !== undefined && (!prev || JSON.stringify(prev) !== JSON.stringify(c));
  const who = c.kind === "original" ? "" : c.version > 1 ? "ours · version " + c.version : "provider's · own number";
  return `<div class="claim ${gone ? "gone" : ""} ${changed ? "new" : ""}">
    <div class="num">${esc(c.number)}</div>
    <div class="what">${esc(KIND[c.kind])} · ${esc(c.procedure)}${who ? " · " + esc(who) : ""}</div>
    ${c.replaces ? `<div class="what">${c.kind === "void" ? "voids" : "replaces"} <span class="mono">${esc(c.replaces)}</span></div>` : c.quoted ? `<div class="what">quotes <span class="mono">${esc(c.quoted)}</span> · not matched</div>` : ""}
    <div class="row"><span class="lbl">status</span>${chip(c.status)}${c.pends.map((p) => `<span class="chip warn">${esc(p)}</span>`).join("")}</div>
    ${c.outcome ? `<div class="row"><span class="lbl">outcome</span>${chip(c.outcome)}${c.denial ? `<span class="chip bad">${esc(lower(c.denial))}</span>` : ""}</div>` : ""}
    ${c.superseded ? `<div class="row"><span class="lbl">superseded</span><span class="chip superseded">by a ${c.superseded === "VOID" ? "void" : "replacement"}</span></div>` : ""}
    <div class="row"><span class="lbl">payment</span>${c.payment ? chip(c.payment) : `<span class="chip">none</span>`}</div>
    ${c.status === "PENDED" || c.outcome === "VOID" ? "" : `<div class="money">plan pays <b>${usd(c.pays)}</b> · member ${usd(c.owes)}</div>`}</div>`;
}

const KIND_LABEL = { standin: "stand-in", remittance: "835 builder", setup: "setup" };
// An example, a call at a time: the calls on the left, every claim's
// state after the chosen one on the right.
function player(id) {
  const ex = T.examples[id];
  const i = sel[id] ?? ex.calls.length - 1;
  const c = ex.calls[i], before = i > 0 ? ex.calls[i - 1].claims : [];
  const prev = (x) => before.find((b) => b.id === x.id) || null;
  const pretty = (j) => esc(JSON.stringify(j, null, 2));
  return `<div class="player"><ol class="steps">${ex.calls.map((x, n) => `<li><button class="${n === i ? "on" : ""}" data-ex="${id}" data-call="${n}">
      <span class="n">${n + 1}</span><span><span class="l">${esc(x.label)}</span>
      <span class="e"><span class="kind ${x.kind}">${esc(x.kind === "rpc" ? x.endpoint : KIND_LABEL[x.kind] + " · " + x.endpoint)}</span>
      ${x.readOnly ? `<span class="chip dry">saves nothing</span>` : ""}${x.rejected ? `<span class="chip bad">refused</span>` : ""}</span></span></button></li>`).join("")}</ol>
    <div class="after box">
      ${c.rejected ? `<div class="refusal"><b>Refused.</b> ${esc(c.rejected)}</div>` : ""}
      ${c.delta ? `<div class="deltabox"><span>payee holds <b>${usd(c.delta.held)}</b></span><span>→ replacement pays <b>${usd(c.delta.projected)}</b></span>
        <span>delta <b style="color:var(--${c.delta.delta < 0 ? "red" : "green"})">${signed(c.delta.delta)}</b></span>${chip(c.delta.basis, "info")}${c.readOnly ? `<span class="chip dry">nothing saved</span>` : ""}</div>` : ""}
      <h4>Claims after this call</h4>

    </div></div>`;
}

// A claim and what replaced it, left to right.
function chain(ex, numbers) {
  return `<div class="chain">${numbers.map((n, i) => {
    const c = byNumber(ex, n);
    return (i ? `<div class="lnk">${c.kind === "void" ? "voided by" : "replaced by"}<br>${c.match ? lower(c.match) : ""}</div>` : "") + claimCard(c);
  }).join("")}</div>`;
}

function remittance(r, n) {
  if (r.error) return `<div class="rem fail"><h3>835 #${n}</h3><small>can't be built</small>
    <p style="margin:8px 0 0;font-size:13.5px">The reversal takes back more than the payment pays. That needs a provider-level adjustment (PLB), which isn't built.</p></div>`;
  return `<div class="rem"><h3>835 #${n} · check ${esc(r.trace)}</h3><small>${esc(r.payer)} → ${esc(r.payee)}</small>
    <table>${r.entries.map((e) => `<tr><td class="mono">${esc(e.number)}</td><td>${e.reversal ? `<span class="chip bad">reversal</span>` : `<span class="chip ok">${esc(lower(e.status))}</span>`}</td><td class="${e.paid < 0 ? "neg" : ""}">${usd(e.paid)}</td></tr>`).join("")}
    <tr class="net"><td colspan="2">Payment</td><td>${usd(r.amount)}</td></tr></table></div>`;
}

  $("#slide").innerHTML = SLIDES[at]();
  $("#dots").innerHTML = SLIDES.map((_, i) => `<i class="${i === at ? "on" : ""} ${PLANNED.has(i) ? "plan" : ""}" data-i="${i}"></i>`).join("");
  $("#count").textContent = `${at + 1} / ${SLIDES.length}`;
  $("#prev").disabled = at === 0;
  $("#next").disabled = at === SLIDES.length - 1;
}
function go(i) {
  chainOpen = null;
  at = Math.min(SLIDES.length - 1, Math.max(0, i));
  try { history.replaceState(null, "", "#" + (at + 1)); } catch {}
  render();
  $(".stage").scrollTop = 0;
}
$("#prev").onclick = () => go(at - 1);
$("#next").onclick = () => go(at + 1);
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest("input, textarea")) return;
  if (ev.key === "ArrowRight") go(at + 1);
  if (ev.key === "ArrowLeft") go(at - 1);
});

async function openEndpoint(name) {
  const e = T.endpoints.flatMap((g) => g.endpoints).find((x) => x.name === name);
  const body = InterfacePanel.open(name, e.built ? "" : "declared in proto · not implemented");
  const r = await fetch(`/api/contract?service=${SERVICE}&methods=${encodeURIComponent(name)}`);
  if (!r.ok) { body.textContent = await r.text(); return; }
  InterfacePanel.showContract(await r.json());
}

document.addEventListener("click", (ev) => {
  const dot = ev.target.closest(".dots i");
  if (dot) return go(+dot.dataset.i);
  const call = ev.target.closest("[data-call]");
  if (call) { sel[call.dataset.ex] = +call.dataset.call; return render(); }
  const f = ev.target.closest("[data-field]");
  if (f) { field = f.dataset.field; return render(); }
  const ch = ev.target.closest("[data-chain]");
  if (ch) { chainOpen = chainOpen === ch.dataset.chain ? null : ch.dataset.chain; return render(); }
  const ep = ev.target.closest("[data-endpoint]");
  if (ep) openEndpoint(ep.dataset.endpoint);
});

fetch("api/tour").then(async (r) => {
  if (!r.ok) throw new Error(await r.text());
  T = await r.json();
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}).catch((err) => { $("#slide").innerHTML = `<div class="loading">Couldn't run the examples: ${esc(err.message)}</div>`; });
</script>
</body>
</html>
