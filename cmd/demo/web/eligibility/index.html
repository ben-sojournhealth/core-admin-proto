<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eligibility</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --nav: #eef1f4; --ink: #18202b; --muted: #687384; --line: #e2e6ec;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e3f3f1;
  --amber: #8a5a00; --amber-soft: #fff4d9; --amber-line: #f2d48b;
  --red: #b42318; --red-soft: #fdecea; --green: #157347; --green-soft: #e2f4ea; --gray-soft: #edf0f3;
  --blue: #1d4ed8; --blue-soft: #e6edff;
  --code: #f3f5f8; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --panel: #171c22; --nav: #13181d; --ink: #e6eaef; --muted: #93a0b0; --line: #262e37;
    --brand: #2dd4bf; --brand-ink: #062320; --brand-soft: #123532;
    --amber: #f3c969; --amber-soft: #2e2611; --amber-line: #5c4a1c;
    --red: #ff8f85; --red-soft: #3a1d1b; --green: #6fdc9f; --green-soft: #15301f; --gray-soft: #232a33;
    --blue: #93b4ff; --blue-soft: #1a2440;
    --code: #12171c; --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

.top { height: 54px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; text-decoration: none; }
.brand svg { width: 22px; height: 22px; color: var(--brand); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
.top .right a { text-decoration: none; }
.top .right a:hover, .linkbtn:hover { color: var(--brand); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100% - 54px); }
nav { background: var(--nav); border-right: 1px solid var(--line); padding: 14px 12px; overflow-y: auto; }
nav h4 { margin: 16px 6px 8px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
nav h4:first-child { margin-top: 2px; }
.card { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 9px; padding: 8px 10px; }
.card:hover { background: var(--gray-soft); }
.card.on { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.card b { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; }
.card small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.card .sent { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
.job { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.COMPLETED { background: var(--green); }
.dot.COMPLETED_WITH_ERRORS { background: var(--amber); }
.dot.FAILED { background: var(--red); }
main { overflow-y: auto; padding: 20px 26px 48px; }
@media (max-width: 860px) { .shell { grid-template-columns: 1fr; height: auto; } nav { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }

.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; word-break: break-all; }
.head .meta { color: var(--muted); font-size: 13px; }
.head .tools { margin-left: auto; display: flex; gap: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); color: var(--brand-ink); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
.chip.APPROVED, .chip.COMPLETED, .chip.ok { background: var(--green-soft); color: var(--green); }
.chip.DENIED, .chip.FAILED, .chip.bad, .chip.REJECTED, .chip.NOT_LOADED { background: var(--red-soft); color: var(--red); }
.chip.PENDED, .chip.COMPLETED_WITH_ERRORS { background: var(--amber-soft); color: var(--amber); }
.chip.f7, .chip.f8 { background: var(--blue-soft); color: var(--blue); }


.sub { color: var(--muted); font-size: 12.5px; }
.chip.APPLIED, .chip.covered { background: var(--green-soft); color: var(--green); }
.chip.EXCEPTION, .chip.ended { background: var(--red-soft); color: var(--red); }
.chip.PROPOSED, .chip.pending { background: var(--amber-soft); color: var(--amber); }
.chip.SKIPPED, .chip.none { background: var(--gray-soft); color: var(--muted); }
.chip.future, .chip.cobra, .chip.approval { background: var(--blue-soft); color: var(--blue); }
.dot.covered { background: var(--green); } .dot.ended { background: var(--red); } .dot.future { background: var(--blue); } .dot.none { background: var(--muted); }
.card .vers { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
.cust { margin: 18px 6px 0; font-size: 13px; font-weight: 700; color: var(--ink); border-top: 1px solid var(--line); padding-top: 12px; }
.badge { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--amber); color: var(--panel); border-radius: 999px; padding: 0 7px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.msg { color: var(--muted); font-size: 13px; }
.who a { text-decoration: none; border-bottom: 1px dashed var(--muted); }
.who a:hover { color: var(--brand); border-color: var(--brand); }
.panel + .panel { margin-top: 14px; }
.ph { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph b { font-weight: 650; }
.terms { padding: 6px 16px 12px; }
.terms div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.terms div:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; padding: 12px 16px; font-size: 13.5px; }
.kv span:nth-child(odd) { color: var(--muted); }

/* timeline */
.tl { padding: 8px 16px 14px; }
.tl .row { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tl .row:last-child { border-bottom: 0; }
.tl .row.head { padding: 4px 0; border-bottom: 0; }
.tl .lab b { font-size: 13px; }
.tl .lab .sub { display: block; font-size: 12px; }
.tl .lab .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.tl .lab .chip { font-size: 11px; padding: 0 7px; }
.track { position: relative; height: 22px; background: var(--code); border-radius: 6px; }
.track .span { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: var(--brand); opacity: .9; }
.track .span.cobra { background: var(--blue); }
.track .today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--amber); }
.months { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.months span { position: absolute; transform: translateX(-2px); }
.row.current .track { outline: 2px solid var(--brand-soft); }
@media (max-width: 860px) { .tl .row { grid-template-columns: 1fr; } }
.yaml { margin: 0; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--code); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; max-height: 460px; }
.yaml .k { color: var(--brand); } .yaml .n { color: var(--blue); } .yaml .d { color: var(--muted); }
details.panel summary { padding: 11px 16px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
details.panel summary::-webkit-details-marker { display: none; }
details.panel summary::before { content: "▸"; color: var(--muted); }
details.panel[open] summary::before { content: "▾"; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    Eligibility
  </a>
  <div class="right">
    <a href="how.html">How it works</a>
    <button class="linkbtn" id="regen" title="Replay every input under the current rules and compare">Regenerate</button>
    <a href="/enrollment-intake/">Enrollment Intake</a>
    <a href="/">All demos</a>
    <button class="linkbtn" id="reset" title="Back to open enrollment">Reset</button>
  </div>
</div>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (iso) => new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "UTC" });
const nice = (s) => String(s).replaceAll("_", " ").toLowerCase().replace(/^./, (c) => c.toUpperCase());
async function get(p) { const r = await fetch(p); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function post(p, b) { const r = await fetch(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b ?? {}) }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3600); }

let O = null;
const pending = () => O.proposals.filter((p) => !p.approved).length;

function nav() {
  const [, kind, id] = location.hash.split("/");
  const on = (k, i) => (kind === k && (i == null || id === i) ? "on" : "");
  let h = `<button class="card ${on("inputs") || (!kind ? "on" : "")}" data-go="#/inputs"><b>Inputs <span class="vers">${O.inputs.length}</span></b><small>Everything that changed eligibility, newest first</small></button>
    <button class="card ${on("approvals")}" data-go="#/approvals"><b>Full-file approvals ${pending() ? `<span class="badge">${pending()}</span>` : ""}</b><small>Terminations a full file proposed</small></button>`;
  let cust = "";
  for (const f of O.families) {
    if (f.customer !== cust) h += `<div class="cust">${esc(cust = f.customer)}</div>`;
    h += `<h4>${esc(f.name)} · ${esc(f.subscriberNumber)}</h4>`;
    h += f.members.map((m) => `<button class="card ${on("member", m.id)}" data-go="#/member/${esc(m.id)}">
      <b><span class="dot ${m.status}"></span>${esc(m.name)}<span class="vers">v${m.versions}</span></b>
      <small>${esc(m.relationship)} · <span class="mono">${esc(m.card)}</span>${m.cobra ? " · COBRA" : ""}</small></button>`).join("");
  }
  $("#nav").innerHTML = h;
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => location.hash = b.dataset.go);
}

const memberLink = (name) => {
  for (const f of O.families) for (const m of f.members) if (m.name === name) return `<a href="#/member/${esc(m.id)}">${esc(name)}</a>`;
  return esc(name);
};

function inputs() {
  $("#main").innerHTML = `<div class="head"><h1>Inputs</h1><span class="meta">recorded in order and never changed · members are derived from them · today is ${esc(O.today)}</span></div>
    <div class="panel"><div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Recorded</th><th>Input</th><th>Outcome</th><th>Members</th></tr></thead>
      <tbody>${O.inputs.map((i) => `<tr>
        <td class="mono sub">${i.sequence}</td>
        <td class="sub" style="white-space:nowrap">${when(i.recorded)}<div>${esc(i.by)}</div></td>
        <td>${i.kind === "approval" ? `<span class="chip approval">approval</span> ` : ""}${esc(i.title)}<div class="sub mono">${esc(i.file)}</div></td>
        <td><span class="chip ${i.status}">${esc(nice(i.status))}</span><div class="msg sub" style="margin-top:3px;max-width:340px">${esc(i.message)}</div></td>
        <td class="who">${i.members.map(memberLink).join(", ")}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function approvals() {
  const list = O.proposals.slice().reverse();
  $("#main").innerHTML = `<div class="head"><h1>Full-file approvals</h1><span class="meta">a full file lists everyone enrolled; members it leaves out are terminated only once approved</span></div>` +
    (list.length ? list.map((p) => `<div class="panel">
      <div class="ph"><b class="mono">${esc(p.file)}</b><span class="sub">from ${esc(p.sender)} · set ${esc(p.set)} · effective ${esc(p.effective)}</span>
        ${p.approved ? `<span class="chip APPLIED">Approved by ${esc(p.approvedBy)}</span>` : `<span class="chip pending">Waiting for approval</span><button class="btn primary" style="margin-left:auto" data-job="${esc(p.jobId)}" data-set="${esc(p.set)}">Approve terminations</button>`}</div>
      <div class="terms">${p.terms.map((t) => `<div><span class="who">${memberLink(t.name)}</span><span class="sub">coverage ${p.approved ? "ended" : "would end"} ${esc(t.end)}</span>${t.cobra ? `<span class="chip pending" title="COBRA continuees are often not on the employer's file">on COBRA</span>` : ""}</div>`).join("")}</div>
    </div>`).join("") : `<div class="panel empty">No full file has left anyone out.</div>`);
  document.querySelectorAll("[data-job]").forEach((b) => b.onclick = async () => {
    try { O = await post("api/approve", { jobId: b.dataset.job, set: b.dataset.set, note: "confirmed with the sponsor" }); nav(); approvals(); toast("Terminations applied."); }
    catch (e) { toast(e.message); }
  });
}

// The timeline runs across the plan year.
const Y0 = Date.UTC(2026, 0, 1), Y1 = Date.UTC(2027, 0, 1);
const pos = (iso) => Math.min(100, Math.max(0, ((Date.parse(iso + "T00:00:00Z") - Y0) / (Y1 - Y0)) * 100));
function track(spans, today) {
  const bars = spans.map((s) => {
    const a = pos(s.from), b = s.to ? pos(addDay(s.to)) : 100;
    return b > a ? `<div class="span ${s.cobra ? "cobra" : ""}" style="left:${a}%;width:${b - a}%" title="${esc(s.from)} – ${esc(s.to || "open")} · ${esc(s.tier)}${s.cobra ? " · COBRA" : ""}"></div>` : "";
  }).join("");
  return `<div class="track">${bars}<div class="today" style="left:${pos(today)}%" title="today"></div></div>`;
}
const addDay = (iso) => new Date(Date.parse(iso + "T00:00:00Z") + 864e5).toISOString().slice(0, 10);
const months = () => `<div class="months">${["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"].map((m, i) => `<span style="left:${(Date.UTC(2026, i, 1) - Y0) / (Y1 - Y0) * 100}%">${m}</span>`).join("")}</div>`;

function yaml(v, pad = "") {
  const sc = (x) => typeof x === "number" || typeof x === "boolean" ? `<span class="n">${x}</span>` : esc(/^[A-Za-z_][\w .:/@-]*$/.test(x) ? x : JSON.stringify(x));
  if (Array.isArray(v)) return v.map((it) => it && typeof it === "object" ? `${pad}<span class="d">-</span> ${yaml(it, pad + "  ").slice(pad.length + 2)}` : `${pad}<span class="d">-</span> ${sc(it)}\n`).join("");
  return Object.entries(v).map(([k, x]) => { const key = `${pad}<span class="k">${esc(k)}</span><span class="d">:</span>`; return x && typeof x === "object" ? `${key}\n${yaml(x, pad + "  ")}` : `${key} ${sc(x)}\n`; }).join("");
}

async function member(id) {
  const m = await get("api/member?id=" + encodeURIComponent(id));
  const vs = m.versions.slice().reverse();
  const cov = m.coverage.map((s) => `${esc(s.from)} – ${esc(s.to || "open")} · ${esc(s.tier)}${s.cobra ? " · COBRA" : ""}`).join("<br>") || "none";
  $("#main").innerHTML = `
    <div class="head"><h1>${esc(m.name)}</h1><span class="chip ${m.status}">${esc(nice(m.status))}${m.cobra ? " · COBRA" : ""}</span><span class="meta"><span class="mono">${esc(m.card)}</span> · ${esc(m.relationship)}${m.family && m.relationship !== "Self" ? ` of ${esc(m.family)}` : ""}</span></div>
    <div class="panel"><div class="kv"><span>Coverage now</span><span>${cov}</span><span>Born</span><span>${esc(m.born || "–")}</span><span>Address</span><span>${esc(m.address || "–")}</span></div></div>
    <div class="panel"><div class="ph"><b>What we believed, version by version</b><span class="sub">across: coverage dates in 2026 · down: when it was recorded, newest first</span></div>
      <div class="tl"><div class="row head"><span></span>${months()}</div>
      ${vs.map((v, i) => `<div class="row ${i === 0 ? "current" : ""}">
        <div class="lab"><b>v${v.version}</b> <span class="sub" style="display:inline">${when(v.recorded)}${i === 0 ? " · current" : ""}</span>
          <span class="sub">${esc(v.title)}</span>
          <div class="chips">${v.changes.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div></div>
        ${track(v.spans, O.today)}</div>`).join("")}
      </div></div>
    <details class="panel"><summary>Member record <span class="muted" style="font-weight:400;font-size:13px">current, as claims see it</span></summary><div class="yaml">${yaml(m.record)}</div></details>`;
}

async function route() {
  O = await get("api/overview");
  nav();
  const [, kind, id] = location.hash.split("/");
  if (kind === "member") return member(id);
  if (kind === "approvals") return approvals();
  return inputs();
}

$("#regen").onclick = async () => {
  try {
    const r = await post("api/regenerate", { dryRun: true });
    toast(r.changed && r.changed.length ? `Replaying every input would change ${r.changed.join(", ")}.` : "Replaying every input gives exactly the members on file.");
  } catch (e) { toast(e.message); }
};
$("#reset").onclick = async () => {
  if (!confirm("Reset to open enrollment? Loaded files and approvals are cleared.")) return;
  O = await post("api/reset"); location.hash = "#/inputs"; route(); toast("Back to open enrollment.");
};
window.onhashchange = route;
route();
</script>
</body>
</html>
