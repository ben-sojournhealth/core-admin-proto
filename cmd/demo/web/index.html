<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Admin Demos</title>
<link rel="stylesheet" href="/shared/interfaces.css">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #d9dde5; --edge: #a3abb9;
  --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #eef2ff; --ext: #f9fafb; --domain: rgba(59,91,219,.035); --oos: #b54708; --proto: #0e7c86; --proto-soft: #e6f6f7; --code: #f6f7f9;
  --shadow: 0 1px 2px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b1f27; --ink: #e7eaf0; --muted: #98a2b3; --line: #343b47; --edge: #5b6575;
    --accent: #7c93ff; --accent-ink: #0d1020; --accent-soft: #232b4d; --ext: #161a21; --domain: rgba(124,147,255,.05); --oos: #f79009; --proto: #3cc6d0; --proto-soft: #0f2e31; --code: #14171d;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; font-weight: 650; margin: 0; }
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-live::before { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.legend .l-planned::before { border: 1.5px dashed var(--edge); }
.legend .l-ext::before { background: var(--ext); border: 1px solid var(--line); }
.legend .l-oos::before { border: 1.5px dashed var(--oos); }
.legend .l-hint::before { display: none; }
.legend .l-hint { font-style: italic; }
main { padding: 16px 18px 28px; max-width: 1240px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.diagram { overflow-x: auto; padding: 10px; }
svg { display: block; width: 100%; min-width: 860px; height: auto; }

/* diagram */
.node rect { fill: var(--panel); stroke: var(--edge); stroke-width: 1.4; stroke-dasharray: 5 4; transition: stroke .15s, fill .15s; }
.node.ext rect { fill: var(--ext); stroke: var(--line); stroke-dasharray: none; }
.node.live rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; stroke-width: 1.6; }
.node .t { font-size: 15px; font-weight: 650; fill: var(--ink); }
.node .s { font-size: 12px; fill: var(--muted); }
.node.planned .t { fill: var(--muted); }
.node.live { cursor: pointer; }
.node.app.live rect { fill: var(--accent); stroke: var(--accent); }
.node.app.live .t { fill: var(--accent-ink); }
.node.app.live .s { fill: var(--accent-ink); opacity: .8; }
.node.live:hover rect, .node.hl rect { stroke-width: 2.6; }
.node.planned.hl rect { stroke: var(--accent); }
.domain rect { fill: var(--domain); stroke: var(--muted); stroke-width: 1.2; }
.domain text { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
/* A domain with a page of its own: its title is a link. */
.domain .dlink { cursor: pointer; fill: var(--accent); }
.domain .more { text-transform: none; letter-spacing: 0; font-weight: 600; }
/* A labelled frame around components inside an open domain. */
.group rect { fill: none; stroke: var(--edge); stroke-width: 1.1; stroke-dasharray: 2 4; }
.group text { font-size: 11.5px; font-weight: 650; fill: var(--muted); }
/* Another domain's component, beside the open domain. */
.node.stub .t { font-size: 13px; }
.node.stub .s { font-size: 11px; }
#arch.in { animation: step .22s ease-out; }
@keyframes step { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #arch.in { animation: none; } }
.tools #back { color: var(--accent); font-weight: 600; text-decoration: none; }
.tools #back:hover { text-decoration: underline; }
.tools #back[hidden] { display: none; }
.domain .dlink:hover { text-decoration: underline; }
/* Contracted out, not built for '28. */
.node.oos rect { stroke: var(--oos); }
.node .s.oos-text { fill: var(--oos); }
.domain.oos rect { fill: none; stroke: var(--oos); stroke-width: 1.8; stroke-dasharray: 9 6; }
.domain .oos-tag { fill: var(--oos); letter-spacing: .03em; text-transform: none; font-weight: 600; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge-label { font-size: 11px; fill: var(--muted); }
.arrow { fill: var(--edge); }
.arrow.on { fill: var(--accent); }
.link { transition: opacity .15s; }
.link.quiet { opacity: 0; }
#arch.focus .link { opacity: .12; }
#arch.focus .link.quiet:not(.on) { opacity: 0; }
#arch.focus .link.on { opacity: 1; }
.link.on .edge { stroke: var(--accent); stroke-width: 2; }
.link.on .edge[marker-end] { marker-end: url(#ah-on); }
.link.on .edge[marker-start] { marker-start: url(#ah-on); }
.link.on .edge-label { fill: var(--accent); font-weight: 600; }
/* Lines with a proto interface: click to inspect it. */
.link.quiet { pointer-events: none; }
#arch.all .link.quiet, .link.quiet.on { pointer-events: auto; }
#arch.all .link.quiet { opacity: 1; }
#arch.all.focus .link.quiet:not(.on) { opacity: .12; }
.link.proto { cursor: pointer; }
.link.proto .edge { stroke: var(--proto); stroke-width: 2; }
.link.proto .edge[marker-end] { marker-end: url(#ah-proto); }
.link.proto .edge-label { fill: var(--proto); font-weight: 600; }
.link.proto:hover .edge, .link.proto.open .edge { stroke-width: 3.2; }
.arrow.proto { fill: var(--proto); }
.hit { fill: none; stroke: transparent; stroke-width: 14; }

.tools { display: flex; align-items: center; gap: 18px; padding: 4px 6px 8px; font-size: 13px; color: var(--muted); }
.tools label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); cursor: pointer; }
.tools .l-proto::before { content: ""; display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--proto); margin-right: 6px; vertical-align: 3px; }



/* demo cards */
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 2px 10px; font-weight: 650; }
.demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.demo { display: block; padding: 14px; text-decoration: none; color: inherit; transition: border-color .15s; }
.demo b { display: block; font-size: 15px; margin-bottom: 3px; }
.demo p { margin: 0; color: var(--muted); font-size: 13px; }
.demo .meta { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--accent); }
a.demo:hover, .demo.hl { border-color: var(--accent); }
.demo.planned { border-style: dashed; box-shadow: none; background: transparent; }
.demo.planned .meta { color: var(--muted); }
</style>
</head>

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let demos = [];
const linksFor = (component) => demos.flatMap((d) => d.links.filter((l) => l.component === component).map((l) => ({ ...l, demo: d })));

// Where clicking a component goes: the first live demo that covers it,
// filtered to the scenario groups for that component.
function target(component) {
  const live = linksFor(component).filter((l) => l.demo.status === "live");
  if (!live.length) return null;
  const d = live[0].demo;
  const groups = live.filter((l) => l.demo === d && l.group).map((l) => l.group);
  return d.path + (groups.length ? "?group=" + encodeURIComponent(groups.join(",")) : "");
}

// The domain a component sits in, "ext:<id>" for an outside source, "" for
// a component outside every domain.
function domainOf(id) {
  const n = NODES.find((n) => n.id === id);
  return n.ext ? "ext:" + id : n.dom || "";
}
// In the overview, lines inside one domain, and from outside sources,
// always show; lines between domains show only when one of their ends is
// hovered.
const alwaysShown = (from, to) => domainOf(from).startsWith("ext:") || domainOf(from) === domainOf(to);

// The domain opened on its own, from the address ("#claims"); null for the
// overview.
const viewFromHash = () => Object.keys(VIEWS).find((k) => "#" + k.toLowerCase() === location.hash) || null;
let view = viewFromHash();

function draw() {
  const V = view ? VIEWS[view] : null;
  const el = document.getElementById("arch");
  const [W, H] = V ? V.size : OVERVIEW;
  el.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el.setAttribute("aria-label", V ? `${view} domain` : "System architecture");
  document.getElementById("back").hidden = !V;
  let svg = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow on" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-proto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow proto" d="M0,0 L10,5 L0,10 z"/></marker></defs><g transform="translate(0,${V ? V.top : TOP})">`;
  // Frames: every domain in the overview, the one domain in its own view.
  const frames = V ? [{ t: view, at: V.frame, href: V.href, more: V.more }] : DOMAINS.map((d) => ({ ...d, at: d.o, opens: VIEWS[d.t] ? d.t : null }));
  for (const d of frames) {
    const [x, y, w, h] = d.at;
    const title = d.opens
      ? `<text class="dlink" x="${x + 14}" y="${y + 24}" data-view="${esc(d.opens)}" tabindex="0" role="link"><title>${esc(d.t)} · open the domain</title>${esc(d.t)}<tspan class="more" dx="8">open →</tspan></text>`
      : d.href
        ? `<text x="${x + 14}" y="${y + 24}">${esc(d.t)}<tspan class="dlink more" dx="10" data-href="${esc(d.href)}" tabindex="0" role="link">${esc(d.more)} →</tspan></text>`
        : `<text x="${x + 14}" y="${y + 24}">${esc(d.t)}</text>`;
    svg += `<g class="domain${d.oos ? " oos" : ""}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/>${title}
      ${d.oos ? `<text class="oos-tag" x="${x + w - 14}" y="${y + 24}" text-anchor="end">out of scope for '28</text>` : ""}</g>`;
  }
  for (const g of V?.groups || []) {
    const [x, y, w, h] = g.at;
    svg += `<g class="group"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/><text x="${x + 10}" y="${y + 17}">${esc(g.t)}</text></g>`;
  }
  for (const e of EDGES) {
    const at = V ? e.v?.[view] : e.o;
    if (!at) continue;
    const [d, lx, ly] = at;
    const quiet = !V && !alwaysShown(e.f, e.t);
    const proto = protoLines.has(e.f + ">" + e.t);
    svg += `<g class="link${quiet ? " quiet" : ""}${proto ? " proto" : ""}" data-from="${e.f}" data-to="${e.t}"${proto ? " data-opens-panel" : ""}>
      ${proto ? `<title>${esc(nameOf(e.f))} → ${esc(nameOf(e.t))} · inspect the interface</title><path class="hit" d="${d}"/>` : ""}
      <path class="edge" d="${d}" marker-end="url(#ah)" ${e.both ? `marker-start="url(#ah)"` : ""}/>
      ${e.l && lx ? `<text class="edge-label" x="${lx}" y="${ly}">${esc(e.l)}</text>` : ""}</g>`;
  }
  for (const n of NODES) {
    const at = V ? n.v?.[view] : n.o;
    if (!at) continue;
    // Another domain's component beside the open domain: small, and named
    // by its domain.
    const stub = !!V && !n.ext && n.dom !== view;
    const [x, y, w] = at;
    const h = at[3] || (stub ? 52 : 72);
    const href = n.ext ? null : target(n.id);
    const cls = (n.ext ? "ext" : href ? "live" : "planned") + (n.app ? " app" : "") + (n.oos ? " oos" : "") + (stub ? " stub" : "");
    const sub = stub ? n.dom : n.s;
    const s2 = stub ? null : n.s2;
    const ty = stub ? y + 22 : n.top ? y + h / 2 + 5 : at[3] ? y + h / 2 - 3 : s2 ? y + 26 : y + 32;
    const anchor = n.ext ? `x="${x + 16}"` : `x="${x + w / 2}" text-anchor="middle"`;
    svg += `<g class="node ${cls}" data-c="${n.id}" ${href ? `data-href="${esc(href)}" tabindex="0" role="link"` : ""}>
      <title>${esc(n.t)}${href ? " · open demo" : n.ext ? "" : " · demo planned"}</title>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>
      <text class="t" ${anchor} y="${ty}">${esc(n.t)}${n.top ? `<tspan class="s" dx="10">${esc(sub)}</tspan>` : ""}</text>
      ${n.top ? "" : `<text class="s" ${anchor} y="${ty + (stub ? 17 : 19)}">${esc(sub)}</text>`}
      ${s2 ? `<text class="s${n.s2oos ? " oos-text" : ""}" ${anchor} y="${ty + 35}">${esc(s2)}</text>` : ""}</g>`;
  }
  el.innerHTML = svg + "</g>";
  // Replay the fade so moving between levels reads as stepping in or out.
  el.classList.remove("in");
  void el.getBoundingClientRect();
  el.classList.add("in");

  document.getElementById("demos").innerHTML = demos.map((d) => d.status === "live"
    ? `<a class="card demo" href="${esc(d.path)}" data-demo="${esc(d.id)}"><b>${esc(d.title)}</b><p>${esc(d.summary)}</p>
        <div class="meta">${d.scenarios ? `${d.scenarios} scenarios →` : "Open →"}</div></a>`
    : `<div class="card demo planned" data-demo="${esc(d.id)}"><b>${esc(d.title)}</b><p>${esc(d.summary)}</p><div class="meta">Planned</div></div>`).join("");
}

// Hovering a component shows all its connections, including those to other
// domains, and fades the rest.
function focusLinks(id) {
  const svg = document.getElementById("arch");
  svg.classList.toggle("focus", !!id);
  svg.querySelectorAll(".link").forEach((l) => l.classList.toggle("on", !!id && (l.dataset.from === id || l.dataset.to === id)));
}

// Hovering a component highlights the demos that cover it, and the reverse.
function highlight(components, demoIds) {
  document.querySelectorAll(".hl").forEach((e) => e.classList.remove("hl"));
  components.forEach((c) => document.querySelector(`.node[data-c="${c}"]`)?.classList.add("hl"));
  demoIds.forEach((id) => document.querySelector(`.demo[data-demo="${id}"]`)?.classList.add("hl"));
}
document.addEventListener("mouseover", (ev) => {
  // Moving onto a line keeps what's shown, so a line can be clicked.
  if (ev.target.closest(".link")) return;
  const node = ev.target.closest(".node[data-c]");
  const card = ev.target.closest(".demo[data-demo]");
  focusLinks(node?.dataset.c);
  if (node) return highlight([], [...new Set(linksFor(node.dataset.c).map((l) => l.demo.id))]);
  if (card) return highlight(demos.find((d) => d.id === card.dataset.demo).links.map((l) => l.component), []);
  highlight([], []);
});
const follow = (ev) => {
  if (ev.type !== "click" && ev.key !== "Enter") return;
  const el = ev.target.closest("[data-href]");
  if (el) return void (location.href = el.dataset.href);
  // A domain's title opens the domain on its own.
  const dom = ev.target.closest("[data-view]");
  if (dom) location.hash = dom.dataset.view.toLowerCase();
};
window.addEventListener("hashchange", () => {
  view = viewFromHash();
  InterfacePanel.close();
  draw();
});
document.addEventListener("click", follow);
document.addEventListener("keydown", follow);

// ---------- interfaces ----------

// The lines with a proto interface, "from>to".
let protoLines = new Set();
const nameOf = (id) => NODES.find((n) => n.id === id)?.t || id;

document.getElementById("all").addEventListener("change", (ev) => {
  document.getElementById("arch").classList.toggle("all", ev.target.checked);
  try { localStorage.setItem("showAll", ev.target.checked ? "1" : ""); } catch {}
});

async function openInterface(from, to) {
  document.querySelectorAll(".link.open").forEach((l) => l.classList.remove("open"));
  document.querySelector(`.link[data-from="${from}"][data-to="${to}"]`)?.classList.add("open");
  const body = InterfacePanel.open(`${nameOf(from)} → ${nameOf(to)}`);
  const r = await fetch(`/api/interface?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
  if (!r.ok) { body.textContent = await r.text(); return; }
  const { interface: itf, contract } = await r.json();
  InterfacePanel.showContract(contract, itf.calls);
}
InterfacePanel.onClose = () => document.querySelectorAll(".link.open").forEach((l) => l.classList.remove("open"));
document.addEventListener("click", (ev) => {
  const line = ev.target.closest(".link.proto");
  if (line) openInterface(line.dataset.from, line.dataset.to);
});

Promise.all([fetch("/api/demos").then((r) => r.json()), fetch("/api/interfaces").then((r) => r.json())]).then(([d, ifs]) => {
  demos = d;
  protoLines = new Set(ifs.map((i) => i.from + ">" + i.to));
  draw();
  let all = false;
  try { all = localStorage.getItem("showAll") === "1"; } catch {}
  document.getElementById("all").checked = all;
  document.getElementById("arch").classList.toggle("all", all);
});
</script>
</body>
</html>
