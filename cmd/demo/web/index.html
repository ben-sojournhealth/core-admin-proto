<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Admin Demos</title>
<link rel="stylesheet" href="/shared/interfaces.css">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #d9dde5; --edge: #a3abb9;
  --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #eef2ff; --ext: #f9fafb; --domain: rgba(59,91,219,.035); --oos: #b54708; --proto: #0e7c86; --proto-soft: #e6f6f7; --code: #f6f7f9;
  --shadow: 0 1px 2px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b1f27; --ink: #e7eaf0; --muted: #98a2b3; --line: #343b47; --edge: #5b6575;
    --accent: #7c93ff; --accent-ink: #0d1020; --accent-soft: #232b4d; --ext: #161a21; --domain: rgba(124,147,255,.05); --oos: #f79009; --proto: #3cc6d0; --proto-soft: #0f2e31; --code: #14171d;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; font-weight: 650; margin: 0; }
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-live::before { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.legend .l-planned::before { border: 1.5px dashed var(--edge); }
.legend .l-ext::before { background: var(--ext); border: 1px solid var(--line); }
.legend .l-oos::before { border: 1.5px dashed var(--oos); }
.legend .l-hint::before { display: none; }
.legend .l-hint { font-style: italic; }
main { padding: 16px 18px 28px; max-width: 1240px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.diagram { overflow-x: auto; padding: 10px; }
svg { display: block; width: 100%; min-width: 860px; height: auto; }

/* diagram */
.node rect { fill: var(--panel); stroke: var(--edge); stroke-width: 1.4; stroke-dasharray: 5 4; transition: stroke .15s, fill .15s; }
.node.ext rect { fill: var(--ext); stroke: var(--line); stroke-dasharray: none; }
.node.live rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; stroke-width: 1.6; }
.node .t { font-size: 15px; font-weight: 650; fill: var(--ink); }
.node .s { font-size: 12px; fill: var(--muted); }
.node.planned .t { fill: var(--muted); }
.node.live { cursor: pointer; }
.node.app.live rect { fill: var(--accent); stroke: var(--accent); }
.node.app.live .t { fill: var(--accent-ink); }
.node.app.live .s { fill: var(--accent-ink); opacity: .8; }
.node.live:hover rect, .node.hl rect { stroke-width: 2.6; }
.node.planned.hl rect { stroke: var(--accent); }
.domain rect { fill: var(--domain); stroke: var(--muted); stroke-width: 1.2; }
.domain text { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
/* A domain with a page of its own: its title is a link. */
.domain .dlink { cursor: pointer; fill: var(--accent); }
.domain .dlink .more { text-transform: none; letter-spacing: 0; font-weight: 600; }
.domain .dlink:hover { text-decoration: underline; }
/* Contracted out, not built for '28. */
.node.oos rect { stroke: var(--oos); }
.node .s.oos-text { fill: var(--oos); }
.domain.oos rect { fill: none; stroke: var(--oos); stroke-width: 1.8; stroke-dasharray: 9 6; }
.domain .oos-tag { fill: var(--oos); letter-spacing: .03em; text-transform: none; font-weight: 600; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge-label { font-size: 11px; fill: var(--muted); }
.arrow { fill: var(--edge); }
.arrow.on { fill: var(--accent); }
.link { transition: opacity .15s; }
.link.quiet { opacity: 0; }
#arch.focus .link { opacity: .12; }
#arch.focus .link.quiet:not(.on) { opacity: 0; }
#arch.focus .link.on { opacity: 1; }
.link.on .edge { stroke: var(--accent); stroke-width: 2; }
.link.on .edge[marker-end] { marker-end: url(#ah-on); }
.link.on .edge[marker-start] { marker-start: url(#ah-on); }
.link.on .edge-label { fill: var(--accent); font-weight: 600; }
/* Lines with a proto interface: click to inspect it. */
.link.quiet { pointer-events: none; }
#arch.all .link.quiet, .link.quiet.on { pointer-events: auto; }
#arch.all .link.quiet { opacity: 1; }
#arch.all.focus .link.quiet:not(.on) { opacity: .12; }
.link.proto { cursor: pointer; }
.link.proto .edge { stroke: var(--proto); stroke-width: 2; }
.link.proto .edge[marker-end] { marker-end: url(#ah-proto); }
.link.proto .edge-label { fill: var(--proto); font-weight: 600; }
.link.proto:hover .edge, .link.proto.open .edge { stroke-width: 3.2; }
.arrow.proto { fill: var(--proto); }
.hit { fill: none; stroke: transparent; stroke-width: 14; }

.tools { display: flex; align-items: center; gap: 18px; padding: 4px 6px 8px; font-size: 13px; color: var(--muted); }
.tools label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); cursor: pointer; }
.tools .l-proto::before { content: ""; display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--proto); margin-right: 6px; vertical-align: 3px; }



/* demo cards */
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 2px 10px; font-weight: 650; }
.demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.demo { display: block; padding: 14px; text-decoration: none; color: inherit; transition: border-color .15s; }
.demo b { display: block; font-size: 15px; margin-bottom: 3px; }
.demo p { margin: 0; color: var(--muted); font-size: 13px; }
.demo .meta { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--accent); }
a.demo:hover, .demo.hl { border-color: var(--accent); }
.demo.planned { border-style: dashed; box-shadow: none; background: transparent; }
.demo.planned .meta { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Core Admin</h1>
  <div class="legend"><span class="l-live">has a demo</span><span class="l-planned">demo planned</span><span class="l-ext">outside the system</span><span class="l-oos">out of scope for '28</span><span class="l-hint">hover a component for its connections</span></div>
</header>
<main>
  <div class="card diagram">
    <div class="tools">
      <label><input type="checkbox" id="all" checked> Show all connections</label>
      <span class="l-proto">proto interface · click to inspect</span>
    </div>
    <svg id="arch" viewBox="0 0 1100 1068" role="img" aria-label="System architecture"></svg></div>
  <h2>Demos</h2>
  <div class="demos" id="demos"></div>
</main>
<script src="/shared/interfaces.js"></script>
<script>
"use strict";
// Components, grouped by domain: Employer on top, Claims in the middle as
// a left-to-right pipeline, Network below it; outside sources on the left.
// Ids match internal/demos.
// Room above the diagram for the admin portal bar.
const TOP = 70;
// Domains: a box drawn around the components that belong together.
const DOMAINS = [
  { t: "Employer", x: 200, y: 8, w: 660, h: 222 },
  // href: the domain's own page, one level in; its title becomes a link.
  { t: "Claims", x: 200, y: 250, w: 660, h: 330, href: "/claims/", more: "how it works" },
  { t: "Network", x: 200, y: 600, w: 660, h: 240 },
  { t: "Finance", x: 875, y: 450, w: 205, h: 230 },
  // TPAs usually contract this out: shown, but out of scope for '28.
  { t: "Medical Management", x: 200, y: 860, w: 400, h: 130, oos: true },
];
const NODES = [
  { id: "enrollment",    x: 20,  y: 95,  w: 160, t: "Employers",        s: "HR · 834 enrollment", ext: true },
  { id: "clearinghouse", x: 20,  y: 392, w: 160, t: "Clearinghouses",   s: "837 claims", ext: true },
  { id: "network-vendors", x: 20, y: 642, w: 160, t: "Network vendors", s: "network · provider files", ext: true },
  { id: "rosters",       x: 20,  y: 732, w: 160, t: "Providers",        s: "rosters · contracts", ext: true },
  // Employer
  { id: "employer-portal",   x: 220, y: 50,  w: 160, t: "Employer Portal",   s: "approvals · views" },
  { id: "plan-design",       x: 410, y: 50,  w: 170, t: "Plan Design",       s: "per-customer benefits" },
  { id: "enrollment-intake", x: 220, y: 140, w: 160, t: "Enrollment Intake", s: "834 full · change" },
  { id: "eligibility",       x: 410, y: 140, w: 170, t: "Eligibility",       s: "members · coverage" },
  // Each employer's funding arrangement, funding requests with their claims
  // register, and our invoices (admin fees, stop-loss premiums).
  { id: "billing-funding",   x: 660, y: 140, w: 180, t: "Billing & Funding", s: "funding · admin fees" },
  // Claims: the pipeline across the middle, reference data above it,
  // disputes feeding back in below.
  { id: "service-definitions", x: 660, y: 292, w: 180, t: "Service Definitions", s: "procedure code groups" },
  { id: "claims-intake", x: 220, y: 392, w: 160, t: "Claims Intake",    s: "837 · 999" },
  { id: "adjudication",  x: 410, y: 392, w: 190, t: "Claim Adjudication", s: "price · pend · adjust · void" },
  { id: "remittance",    x: 660, y: 392, w: 180, t: "Remittance & EOBs", s: "835 · EOP · EOB" },
  { id: "disputes",      x: 220, y: 492, w: 160, t: "Disputes",         s: "reconsiderations · appeals" },
  { id: "settlement",    x: 660, y: 492, w: 180, t: "Settlement",       s: "payee · funds · netting" },
  // Network. oos: out of scope for '28 (contracted out).
  // What providers do through it, on two lines; s2oos: the second line is
  // out of scope for '28.
  { id: "provider-portal", x: 220, y: 732, w: 160, t: "Provider Portal", s: "claim status · disputes", s2: "prior auths", s2oos: true },
  { id: "provider-data", x: 410, y: 642, w: 190, t: "Provider Data",    s: "management · directory" },
  { id: "contracting",   x: 660, y: 642, w: 180, t: "Contracting",      s: "provider contracts", oos: true },
  { id: "vendor-intake", x: 220, y: 642, w: 160, t: "Vendor Intake",    s: "network vendor files" },
  { id: "roster-intake", x: 410, y: 732, w: 190, t: "Roster Intake",    s: "roster loads", oos: true },
  { id: "credentialing", x: 660, y: 732, w: 180, t: "Credentialing",    s: "verification · sanctions", oos: true },
  // Medical management
  { id: "medical-policy", x: 220, y: 902, w: 160, t: "Medical Policy",   s: "criteria · auth lists" },
  { id: "authorization",  x: 410, y: 902, w: 190, t: "Authorization",    s: "prior auth · UM review" },
  // Finance
  { id: "disbursement",  x: 890, y: 492, w: 175, t: "Disbursement",     s: "funding · EFT · checks" },
  { id: "stop-loss",     x: 890, y: 592, w: 175, t: "Stop-Loss",        s: "specific · aggregate" },
  // Over everything we run, not one component: drawn as a bar above the rest.
  { id: "journey",       x: 200, y: -62, w: 880, h: 48, t: "Journey",      s: "admin portal", app: true, top: true },
];
// Edges: [from, to, path, label?, label x, label y, ends?]. ends "both"
// draws an arrow at each end. Edges within a domain (or from an outside
// source) always show; the rest show when one of their ends is hovered.
const EDGES = [
  // Employer
  ["enrollment", "employer-portal", "M180,113 H200 V86 H220"], ["enrollment", "enrollment-intake", "M180,149 H200 V176 H220"],
  ["employer-portal", "plan-design", "M380,74 H410", "", 0, 0, "both"], ["employer-portal", "eligibility", "M380,100 H395 V158 H410", "", 0, 0, "both"],
  ["enrollment-intake", "eligibility", "M380,176 H410"],
  ["eligibility", "adjudication", "M495,212 V392", "members", 501, 240],
  ["plan-design", "adjudication", "M580,100 H620 V376 H560 V392", "plans", 626, 250],
  // Funding: member counts for admin fees; the employer sees each request
  // and its claims register; funded cycles release payments.
  ["eligibility", "billing-funding", "M580,176 H660", "counts", 600, 170],
  ["employer-portal", "billing-funding", "M340,50 V30 H750 V140", "", 0, 0, "both"],
  ["settlement", "billing-funding", "M840,546 H850 V200 H840", "needs", 790, 380],
  ["billing-funding", "disbursement", "M840,176 H1000 V492", "funded", 1006, 300],
  // Claims. Plan design names service definitions ("burn treatment: 20%").
  ["service-definitions", "plan-design", "M660,310 H645 V80 H580"],
  ["service-definitions", "adjudication", "M660,346 H640 V410 H600"],
  ["clearinghouse", "claims-intake", "M180,428 H220"], ["claims-intake", "adjudication", "M380,428 H410"],
  ["adjudication", "remittance", "M600,442 H660", "preview", 609, 456],
  ["disputes", "adjudication", "M380,528 H395 V452 H410"],
  // Settlement can be previewed before the claim is adjudicated, like the 835.
  ["adjudication", "settlement", "M580,464 V528 H660", "preview", 600, 522],
  ["settlement", "disbursement", "M840,528 H890"],
  ["disbursement", "remittance", "M978,492 V428 H840", "paid", 984, 470],
  ["adjudication", "stop-loss", "M595,464 V478 H870 V628 H890"],
  ["disbursement", "stop-loss", "M978,564 V592", "paid dates", 984, 584],
  // Network
  ["network-vendors", "vendor-intake", "M180,678 H220"], ["rosters", "provider-portal", "M180,768 H220"],
  ["rosters", "roster-intake", "M180,768 H205 V826 H495 V804"], ["rosters", "credentialing", "M180,768 H205 V826 H750 V804"],
  ["rosters", "contracting", "M180,768 H205 V826 H850 V678 H840"],
  ["vendor-intake", "provider-data", "M380,678 H410"], ["roster-intake", "provider-data", "M495,732 V714"],
  ["credentialing", "provider-data", "M660,768 H620 V696 H600"],
  ["provider-portal", "disputes", "M380,750 H395 V546 H380"],
  ["provider-data", "adjudication", "M480,642 V464", "providers", 486, 620],
  ["contracting", "adjudication", "M750,642 V583 H565 V464", "contracts", 756, 620],
  ["provider-portal", "authorization", "M380,790 H403 V920 H410"],
  ["medical-policy", "authorization", "M380,938 H410"],
  ["authorization", "adjudication", "M600,920 H630 V597 H525 V464", "auths", 636, 880],
];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let demos = [];
const linksFor = (component) => demos.flatMap((d) => d.links.filter((l) => l.component === component).map((l) => ({ ...l, demo: d })));

// Where clicking a component goes: the first live demo that covers it,
// filtered to the scenario groups for that component.
function target(component) {
  const live = linksFor(component).filter((l) => l.demo.status === "live");
  if (!live.length) return null;
  const d = live[0].demo;
  const groups = live.filter((l) => l.demo === d && l.group).map((l) => l.group);
  return d.path + (groups.length ? "?group=" + encodeURIComponent(groups.join(",")) : "");
}

// The domain a component sits in (by position), "ext:<id>" for an outside
// source, "" for a component outside every domain.
function domainOf(id) {
  const n = NODES.find((n) => n.id === id);
  if (n.ext) return "ext:" + id;
  const d = DOMAINS.find((d) => n.x >= d.x && n.x + n.w <= d.x + d.w && n.y >= d.y && n.y <= d.y + d.h);
  return d ? d.t : "";
}
// Edges inside one domain, and from outside sources, always show; edges
// between domains show only when one of their ends is hovered.
const alwaysShown = (from, to) => domainOf(from).startsWith("ext:") || domainOf(from) === domainOf(to);

function draw() {
  let svg = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow on" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-proto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow proto" d="M0,0 L10,5 L0,10 z"/></marker></defs><g transform="translate(0,${TOP})">`;
  for (const d of DOMAINS) {
    svg += `<g class="domain${d.oos ? " oos" : ""}"><rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="14"/>
      ${d.href ? `<text class="dlink" x="${d.x + 14}" y="${d.y + 24}" data-href="${esc(d.href)}" tabindex="0" role="link"><title>${esc(d.t)} · ${esc(d.more)}</title>${esc(d.t)}<tspan class="more" dx="8">${esc(d.more)} →</tspan></text>`
        : `<text x="${d.x + 14}" y="${d.y + 24}">${esc(d.t)}</text>`}
      ${d.oos ? `<text class="oos-tag" x="${d.x + d.w - 14}" y="${d.y + 24}" text-anchor="end">out of scope for '28</text>` : ""}</g>`;
  }
  for (const [from, to, d, label, lx, ly, ends] of EDGES) {
    const quiet = !alwaysShown(from, to);
    const proto = protoLines.has(from + ">" + to);
    svg += `<g class="link${quiet ? " quiet" : ""}${proto ? " proto" : ""}" data-from="${from}" data-to="${to}"${proto ? " data-opens-panel" : ""}>
      ${proto ? `<title>${esc(nameOf(from))} → ${esc(nameOf(to))} · inspect the interface</title><path class="hit" d="${d}"/>` : ""}
      <path class="edge" d="${d}" marker-end="url(#ah)" ${ends === "both" ? `marker-start="url(#ah)"` : ""}/>
      ${label ? `<text class="edge-label" x="${lx}" y="${ly}">${esc(label)}</text>` : ""}</g>`;
  }
  for (const n of NODES) {
    const h = n.h || 72;
    const href = n.ext ? null : target(n.id);
    const cls = (n.ext ? "ext" : href ? "live" : "planned") + (n.app ? " app" : "") + (n.oos ? " oos" : "");
    const ty = n.top ? n.y + h / 2 + 5 : n.h ? n.y + h / 2 - 3 : n.s2 ? n.y + 26 : n.y + 32;
    const cx = n.x + n.w / 2;
    const anchor = n.ext ? `x="${n.x + 16}"` : `x="${cx}" text-anchor="middle"`;
    svg += `<g class="node ${cls}" data-c="${n.id}" ${href ? `data-href="${esc(href)}" tabindex="0" role="link"` : ""}>
      <title>${esc(n.t)}${href ? " · open demo" : n.ext ? "" : " · demo planned"}</title>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${h}" rx="10"/>
      <text class="t" ${anchor} y="${ty}">${esc(n.t)}${n.top ? `<tspan class="s" dx="10">${esc(n.s)}</tspan>` : ""}</text>
      ${n.top ? "" : `<text class="s" ${anchor} y="${ty + 19}">${esc(n.s)}</text>`}
      ${n.s2 ? `<text class="s${n.s2oos ? " oos-text" : ""}" ${anchor} y="${ty + 35}">${esc(n.s2)}</text>` : ""}</g>`;
  }
  document.getElementById("arch").innerHTML = svg + "</g>";

  document.getElementById("demos").innerHTML = demos.map((d) => d.status === "live"
    ? `<a class="card demo" href="${esc(d.path)}" data-demo="${esc(d.id)}"><b>${esc(d.title)}</b><p>${esc(d.summary)}</p>
        <div class="meta">${d.scenarios ? `${d.scenarios} scenarios →` : "Open →"}</div></a>`
    : `<div class="card demo planned" data-demo="${esc(d.id)}"><b>${esc(d.title)}</b><p>${esc(d.summary)}</p><div class="meta">Planned</div></div>`).join("");
}

// Hovering a component shows all its connections, including those to other
// domains, and fades the rest.
function focusLinks(id) {
  const svg = document.getElementById("arch");
  svg.classList.toggle("focus", !!id);
  svg.querySelectorAll(".link").forEach((l) => l.classList.toggle("on", !!id && (l.dataset.from === id || l.dataset.to === id)));
}

// Hovering a component highlights the demos that cover it, and the reverse.
function highlight(components, demoIds) {
  document.querySelectorAll(".hl").forEach((e) => e.classList.remove("hl"));
  components.forEach((c) => document.querySelector(`.node[data-c="${c}"]`)?.classList.add("hl"));
  demoIds.forEach((id) => document.querySelector(`.demo[data-demo="${id}"]`)?.classList.add("hl"));
}
document.addEventListener("mouseover", (ev) => {
  // Moving onto a line keeps what's shown, so a line can be clicked.
  if (ev.target.closest(".link")) return;
  const node = ev.target.closest(".node[data-c]");
  const card = ev.target.closest(".demo[data-demo]");
  focusLinks(node?.dataset.c);
  if (node) return highlight([], [...new Set(linksFor(node.dataset.c).map((l) => l.demo.id))]);
  if (card) return highlight(demos.find((d) => d.id === card.dataset.demo).links.map((l) => l.component), []);
  highlight([], []);
});
const follow = (ev) => {
  const el = ev.target.closest("[data-href]");
  if (el && (ev.type === "click" || ev.key === "Enter")) location.href = el.dataset.href;
};
document.addEventListener("click", follow);
document.addEventListener("keydown", follow);

// ---------- interfaces ----------

// The lines with a proto interface, "from>to".
let protoLines = new Set();
const nameOf = (id) => NODES.find((n) => n.id === id)?.t || id;

document.getElementById("all").addEventListener("change", (ev) => {
  document.getElementById("arch").classList.toggle("all", ev.target.checked);
  try { localStorage.setItem("showAll", ev.target.checked ? "1" : "0"); } catch {}
});

async function openInterface(from, to) {
  document.querySelectorAll(".link.open").forEach((l) => l.classList.remove("open"));
  document.querySelector(`.link[data-from="${from}"][data-to="${to}"]`)?.classList.add("open");
  const body = InterfacePanel.open(`${nameOf(from)} → ${nameOf(to)}`);
  const r = await fetch(`/api/interface?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
  if (!r.ok) { body.textContent = await r.text(); return; }
  const { interface: itf, contract } = await r.json();
  InterfacePanel.showContract(contract, itf.calls);
}
InterfacePanel.onClose = () => document.querySelectorAll(".link.open").forEach((l) => l.classList.remove("open"));
document.addEventListener("click", (ev) => {
  const line = ev.target.closest(".link.proto");
  if (line) openInterface(line.dataset.from, line.dataset.to);
});

Promise.all([fetch("/api/demos").then((r) => r.json()), fetch("/api/interfaces").then((r) => r.json())]).then(([d, ifs]) => {
  demos = d;
  protoLines = new Set(ifs.map((i) => i.from + ">" + i.to));
  draw();
  let all = true;
  try { all = localStorage.getItem("showAll") !== "0"; } catch {}
  document.getElementById("all").checked = all;
  document.getElementById("arch").classList.toggle("all", all);
});
</script>
</body>
</html>
