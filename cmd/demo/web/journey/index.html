<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --nav: #eef1f4; --ink: #18202b; --muted: #687384; --line: #e2e6ec;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e3f3f1;
  --plan: #0f766e; --member: #d9822b; --writeoff: #e3e7ed;
  --amber: #8a5a00; --amber-soft: #fff4d9; --amber-line: #f2d48b;
  --red: #b42318; --red-soft: #fdecea; --green: #157347; --green-soft: #e2f4ea; --gray-soft: #edf0f3;
  --flash: #fff3bf; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --panel: #171c22; --nav: #13181d; --ink: #e6eaef; --muted: #93a0b0; --line: #262e37;
    --brand: #2dd4bf; --brand-ink: #062320; --brand-soft: #123532;
    --plan: #2dd4bf; --member: #f0a04b; --writeoff: #2a323c;
    --amber: #f3c969; --amber-soft: #2e2611; --amber-line: #5c4a1c;
    --red: #ff8f85; --red-soft: #3a1d1b; --green: #6fdc9f; --green-soft: #15301f; --gray-soft: #232a33;
    --flash: #3f3814; --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* top bar */
.top { height: 54px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-decoration: none; margin-right: 6px; }
.brand svg { width: 24px; height: 24px; }
.search { flex: 1; min-width: 150px; max-width: 340px; position: relative; }
.search input { width: 100%; padding: 7px 12px 7px 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
.search input:focus { outline: 2px solid var(--brand); outline-offset: -1px; background: var(--panel); }
.search svg { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; stroke: var(--muted); }
.tabs { display: flex; gap: 2px; align-self: stretch; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; text-decoration: none; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; border-top: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--brand); border-bottom-color: var(--brand); }
.tab .n { font-size: 11.5px; font-weight: 650; border-radius: 999px; padding: 0 6px; background: var(--amber-soft); color: var(--amber); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
.top .right a { text-decoration: none; }
.top .right a:hover, .linkbtn:hover { color: var(--brand); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: calc(100% - 54px); }
nav { background: var(--nav); border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
nav h4 { margin: 14px 10px 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
nav h4:first-child { margin-top: 2px; }
.q { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 7px; padding: 6px 10px; text-align: left; text-decoration: none; }
.q:hover { background: var(--gray-soft); }
.q.on { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.q.kid { padding-left: 24px; font-size: 13px; color: var(--muted); }
.q.kid.on { color: var(--ink); }
.q .n { margin-left: auto; font-size: 12px; font-weight: 650; min-width: 22px; text-align: center; border-radius: 999px; padding: 0 6px; background: var(--gray-soft); color: var(--muted); }
.q .n.hot { background: var(--amber-soft); color: var(--amber); }
.q.off { color: var(--muted); cursor: default; opacity: .75; }
.q.off:hover { background: none; }
.q .tag { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
.q.ext .tag { border: 0; font-size: 13px; }
main { overflow-y: auto; padding: 20px 26px 40px; }
@media (max-width: 1000px) { .top { height: auto; flex-wrap: wrap; padding: 8px 14px 0; gap: 8px 14px; } .tabs { order: 5; width: 100%; overflow-x: auto; } .tab { padding: 8px 10px; } .shell { height: auto; } }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; height: auto; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }

/* list */
.head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.head h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.head .tools { margin-left: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.tablewrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list tr:last-child td { border-bottom: 0; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover td { background: var(--brand-soft); }
table.list .r { text-align: right; }
.id { font-weight: 650; }
.sub { color: var(--muted); font-size: 12.5px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
.chip.todo { background: var(--amber-soft); color: var(--amber); }
.chip.APPROVED { background: var(--green-soft); color: var(--green); }
.chip.DENIED { background: var(--red-soft); color: var(--red); }
.chip.PENDED, .chip.PARTIALLY_DENIED { background: var(--amber-soft); color: var(--amber); }
.chip.superseded { background: transparent; border: 1px dashed var(--muted); }
.age.old { color: var(--red); font-weight: 600; }
.clear { padding: 56px 20px; text-align: center; color: var(--muted); }
.clear b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 2px; }

/* claim */
.back { display: inline-block; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 10px; }
.back:hover { color: var(--brand); }
.claimhead { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.claimhead h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.claimhead .who { color: var(--muted); margin-top: 2px; }
.claimhead .tools { margin-left: auto; display: flex; gap: 8px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
.section { padding: 16px; }
.section + .section { border-top: 1px solid var(--line); }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin-bottom: 10px; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); color: var(--brand-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* money */
.money { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.money div small { display: block; font-size: 12px; color: var(--muted); }
.money div b { font-size: 19px; font-weight: 650; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--writeoff); }
.seg { min-width: 3px; transition: flex-grow .4s; }
.seg.plan { background: var(--plan); }
.seg.member { background: var(--member); }
.seg.writeoff { background: var(--writeoff); }
.seg.pended { background: repeating-linear-gradient(135deg, var(--amber-soft), var(--amber-soft) 6px, var(--gray-soft) 6px, var(--gray-soft) 12px); }
.seg.denied { background: var(--red); }
.track { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin-top: 14px; font-size: 12px; color: var(--muted); }
.track span { display: flex; align-items: center; gap: 5px; }
.track span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.track span.on { color: var(--ink); font-weight: 600; }
.track span.on::before { background: var(--brand); border-color: var(--brand); }
.track span.bad.on::before { background: var(--red); border-color: var(--red); }
.track span.warn.on::before { background: var(--member); border-color: var(--member); }
.track b { width: 20px; height: 1.5px; background: var(--line); margin: 0 6px; }

/* work items */
.work { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.work h3 { margin: 0; font-size: 15px; color: var(--amber); }
.work p { margin: 3px 0 0; font-size: 13px; }
.work .do { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.work input { flex: 1; min-width: 200px; padding: 6px 10px; border: 1px solid var(--amber-line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
.work .hint { font-size: 12.5px; color: var(--muted); }
.note { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; background: var(--gray-soft); color: var(--muted); }
.note.red { background: var(--red-soft); color: var(--red); }

.corr { display: inline-flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand); }
.corr a { color: inherit; }
.corr .sub { font-weight: 400; }
.corr.open { background: var(--amber-soft); color: var(--amber); }
.chip.corr { margin: 0; font-size: 11px; padding: 0 7px; vertical-align: 1px; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 3px 0; }
.kv > span:first-child { color: var(--muted); }
.kv > span:last-child { overflow-wrap: anywhere; }
.kv a { color: var(--brand); text-decoration: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
table.lines { width: 100%; border-collapse: collapse; font-size: 13px; }
table.lines th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 0 8px 8px 0; }
table.lines td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.lines .r { text-align: right; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px 20px; }
.fact small { display: block; font-size: 12px; color: var(--muted); }
.fact b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.fact .sub { display: block; }
.fact .chip { margin-top: 5px; }
.said { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--line); font-size: 12.5px; color: var(--muted); }
details.mini { margin-top: 8px; font-size: 12.5px; }
details.mini > summary { cursor: pointer; color: var(--brand); font-weight: 600; }
.tree { margin-top: 8px; }
.tree .kv { padding: 1px 0; font-size: 12.5px; }
.tgroup { margin: 6px 0 6px 2px; padding-left: 10px; border-left: 2px solid var(--line); }
.tk { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
.codes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.codes > small { font-size: 12px; color: var(--muted); margin-right: 2px; }
.codes > small:not(:first-child) { margin-left: 12px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; background: var(--bg); white-space: nowrap; }
.code.first { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.box .pair .mono { font-size: 12px; }
.cas { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); }

/* side */
.meter { margin-bottom: 12px; }
.meter .row { display: flex; justify-content: space-between; font-size: 12.5px; }
.meter .row span:first-child { color: var(--muted); }
.meter .track2 { height: 7px; border-radius: 4px; background: var(--gray-soft); margin-top: 4px; overflow: hidden; }
.meter .track2 i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transition: width .4s; }
.meter .track2 i.full { background: var(--green); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 12px 16px; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: 0; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.tl li:first-child::before { background: var(--brand); }
.tl details summary { cursor: pointer; list-style: none; }
.tl details summary::-webkit-details-marker { display: none; }
.tl ul { margin: 4px 0 0; padding-left: 14px; color: var(--muted); font-size: 12.5px; }
.tl .err { color: var(--red); font-size: 12.5px; }
.rel a { display: inline-block; margin: 0 6px 4px 0; font-weight: 600; color: var(--brand); text-decoration: none; }
.changed { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }

/* the tabs beside Claims */
table.list.tight td, table.list.tight th { padding: 8px 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 16px 0 18px; }
.tile { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; text-decoration: none; box-shadow: var(--shadow); }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 21px; font-weight: 650; }
a.tile[href]:hover, a.box:hover { border-color: var(--brand); }
.tile.on { border-color: var(--brand); background: var(--brand-soft); }
.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.boxes.one { grid-template-columns: 1fr; }
.boxes.wide { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.pair span { white-space: nowrap; }
.box { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-decoration: none; background: var(--panel); }
.box b { display: block; font-size: 14px; }
.box small { display: block; font-size: 12px; color: var(--muted); }
.box .chip { margin-top: 6px; }
.box.on { border-color: var(--brand); background: var(--brand-soft); }
.box.dim { opacity: .6; }
.box.plain { background: var(--bg); }
.pair { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.pair > span:first-child { color: var(--muted); }
.planhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.planhead b { font-size: 15px; }
.kv.wide { grid-template-columns: 132px minmax(0, 1fr); }
summary.more { cursor: pointer; margin-bottom: 8px; }
.cov { position: relative; height: 8px; border-radius: 4px; background: var(--gray-soft); min-width: 120px; }
.cov.tall { height: 14px; border-radius: 6px; }
.cov i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--brand); }
.cov i.cobra { background: var(--member); }
.cov i.paid { background: var(--member); }
.cov u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.months span { padding-left: 2px; border-left: 1px solid var(--line); }
.win { display: grid; grid-template-columns: 70px minmax(0, 1fr) 200px; gap: 12px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.win > span:first-child { color: var(--muted); }
@media (max-width: 700px) { .win { grid-template-columns: 70px minmax(0, 1fr); } .win .sub { grid-column: 2; } }
.bar.thick { height: 16px; border-radius: 8px; }
.seg.t0 { background: var(--brand); } .seg.t1 { background: var(--member); } .seg.t2 { background: #7c6fd6; } .seg.t3 { background: #3b82c4; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; min-width: 0; }
.legend b { color: var(--ink); }
.hollow { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
.hollow small { display: block; font-size: 12px; }
td.dir { font-size: 12px; font-weight: 600; color: var(--muted); }
td.dir.IN { color: var(--brand); }
table.list tbody tr:not([data-claim]):not([data-go]):not([data-open]) { cursor: default; }
table.list tbody tr:not([data-claim]):not([data-go]):not([data-open]):hover td { background: none; }
.clear a { color: var(--brand); }
.who a { color: var(--brand); text-decoration: none; }

/* toast + dialog */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: min(620px, calc(100vw - 32px)); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.bad { background: var(--red); color: #fff; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(500px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog form { padding: 18px; }
dialog h3 { margin: 0 0 12px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
label.wide { grid-column: 1 / -1; }
dialog input { width: 100%; margin-top: 3px; padding: 6px 9px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.formerr { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 1em; }
.delta { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--brand-soft); }
.delta b { font-size: 18px; }
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#/q/pended">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="17" r="2.6" fill="currentColor" style="color:var(--brand)"/><circle cx="19" cy="7" r="2.6" fill="currentColor" style="color:var(--brand)"/><path d="M7.4 15.6 C 11 13, 13 11, 16.6 8.4" stroke="currentColor" stroke-width="2" stroke-dasharray="2.5 2.5" stroke-linecap="round" style="color:var(--brand)"/></svg>
    Journey</a>
  <div class="tabs" id="tabs"></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search claims, members, procedures" autocomplete="off"></div>
  <div class="right"><span id="today"></span><a href="../">Architecture</a><button class="linkbtn" id="reset" title="Start over with the two-week workload">Reset</button></div>
</div>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="tabs.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (c) => (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: c % 100 ? 2 : 0 });
const words = (s) => String(s).toLowerCase().replace(/_/g, " ");
// A claim carries four separate facts: status (received, pended,
// adjudicated), outcome (what was decided), superseded (a replacement or
// void took its place) and payment. decision is the one word for the
// first two: the status until adjudicated, then the outcome.
const decision = (c) => c.status === "ADJUDICATED" ? c.outcome : c.status;
const supersededWord = (c) => c.superseded === "VOID" ? "voided" : c.superseded ? "replaced" : "";
const OUTCOME_LABEL = { APPROVED: "Approved", PARTIALLY_DENIED: "Partially denied", DENIED: "Denied", VOID: "Void" };
const decisionChips = (c, style = "") => `<span class="chip ${decision(c)}"${style}>${words(decision(c))}</span>${c.superseded ? ` <span class="chip superseded"${style} title="superseded by ${esc(c.supersededBy || "a later claim")}">${supersededWord(c)}</span>` : ""}`;

const PEND = {
  PRIOR_AUTH_REQUIRED: "Prior authorization", POSSIBLE_DUPLICATE: "Possible duplicate", NO_ELIGIBILITY: "No eligibility",
  NO_BENEFIT_MATCH: "No benefit match", MEMBER_NOT_FOUND: "Member not found", NO_PRICE: "No price",
  COVERAGE_IN_GRACE: "Grace period", NO_TIER: "No network tier", NO_PLAN_VERSION: "No plan version",
  ORIGINAL_NOT_FOUND: "Original not found", ORIGINAL_NOT_FINALIZED: "Original not final",
  REOPENED: "Reopened", ORIGINAL_HAS_OPEN_REPLACEMENT: "Replacement in progress", REMARK_CODE_REQUIRED: "Remark code missing",
};
const PEND_HELP = {
  PRIOR_AUTH_REQUIRED: "Confirm the authorization, then override.",
  POSSIBLE_DUPLICATE: "Check with the provider whether these are separate services.",
  NO_ELIGIBILITY: "Waiting on enrollment. Reprocess once coverage is loaded.",
  NO_BENEFIT_MATCH: "The plan has no benefit for this service. It needs a plan design change; claims can't be denied by hand yet.",
  NO_PRICE: "Waiting on a rate for this service.",
  MEMBER_NOT_FOUND: "Find the member from the patient and subscriber as sent. Linking by hand isn't built yet.",
  ORIGINAL_NOT_FOUND: "Find the original with the provider, from the patient control number or the EOP. Linking by hand isn't built yet.",
  ORIGINAL_NOT_FINALIZED: "The claim it corrects hasn't been decided. Resolve that claim first, then reprocess this one.",
  REOPENED: "Reopened before anything was reported. Reprocess it when it's ready to be decided again.",
  REMARK_CODE_REQUIRED: "A denial reason needs a remark code on the 835 and doesn't have one. Fix the reporting rules, then reprocess.",
};
const pendName = (code) => PEND[code] || words(code);

let S = null, D = null, prevClaims = {}, fresh = new Set();
let lastQueue = "pended";

const QUEUES = [
  { id: "pended", label: "Pended", work: true, test: (c) => c.status === "PENDED" },
  { id: "all", label: "All claims", browse: true, test: () => true },
  // By outcome, for claims still in force; superseded claims and the
  // voids that cancelled them are together at the end.
  { id: "approved", label: "Approved", browse: true, test: (c) => c.outcome === "APPROVED" && !c.superseded },
  { id: "partial", label: "Partially denied", browse: true, test: (c) => c.outcome === "PARTIALLY_DENIED" && !c.superseded },
  { id: "denied", label: "Denied", browse: true, test: (c) => c.outcome === "DENIED" && !c.superseded },
  { id: "closed", label: "Replaced & voided", browse: true, test: (c) => !!c.superseded || c.outcome === "VOID" },
];

async function get(path) { const r = await fetch(path); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function load() {
  const [st, admin] = await Promise.all([get("api/state"), get("api/admin")]);
  A = admin;
  const next = {};
  fresh = new Set();
  for (const c of st.claims) {
    const { raw, ...rest } = c;
    next[c.id] = JSON.stringify(rest);
    if (S && prevClaims[c.id] !== next[c.id]) fresh.add(c.id);
  }
  prevClaims = next;
  S = st;
  await route();
}

// ---------- routing ----------
// Claims: #/q/<queue>[/<pend code>], #/claim/<claim number>, #/search/<text>.
// The other tabs' routes are in tabs.js (routeTab).
// Claim pages are addressed by claim number; the internal id is only used
// to fetch. An old id link still resolves.
const claimHref = (c) => "#/claim/" + encodeURIComponent(c.number || c.id);
function goToClaim(id) {
  const c = S.claims.find((x) => x.id === id);
  if (c) location.hash = claimHref(c);
}
async function route() {
  const [, kind, a, b] = location.hash.split("/");
  const tab = TAB_OF[kind] || "claims";
  if (tab !== TAB) { FILTER = ""; $("#q").value = ""; }
  TAB = tab;
  renderTabs();
  $("#today").textContent = new Date(S.today).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  D = null;
  if (await routeTab(kind, a, b)) return;
  renderNav(kind === "q" ? a : null, b);
  if (kind === "claim") {
    const key = decodeURIComponent(a);
    const c = S.claims.find((x) => x.number === key) || S.claims.find((x) => x.id === key);
    if (!c) {
      $("#main").innerHTML = `<div class="clear"><b>No claim ${esc(key)}</b>It may have been removed by a reset.</div>`;
      return;
    }
    if (c.number && key !== c.number) return history.replaceState(null, "", claimHref(c)), route();
    D = await get("api/claim?id=" + encodeURIComponent(c.id));
    return renderClaim();
  }
  if (kind === "search") return renderList({ label: "Search", test: matches(decodeURIComponent(a || "")) }, null, true);
  const q = QUEUES.find((x) => x.id === a) || QUEUES[0];
  lastQueue = q.id + (b ? "/" + b : "");
  renderList(q, b);
}
window.addEventListener("hashchange", route);

function matches(text) {
  const t = text.trim().toLowerCase();
  return (c) => !t || [c.number, c.member, c.provider, c.procedure, c.dos].some((v) => String(v).toLowerCase().includes(t));
}

// ---------- nav ----------
function renderNav(active, code) {
  const count = (q) => S.claims.filter(q.test).length;
  const link = (q) => {
    const n = count(q);
    return `<a class="q ${active === q.id && !code ? "on" : ""}" href="#/q/${q.id}">${esc(q.label)}<span class="n ${q.work && n ? "hot" : ""}">${n}</span></a>`;
  };
  const codes = {};
  for (const c of S.claims) if (c.status === "PENDED") for (const p of c.pends) codes[p.code] = (codes[p.code] || 0) + 1;
  const kids = Object.keys(codes).sort().map((k) =>
    `<a class="q kid ${active === "pended" && code === k ? "on" : ""}" href="#/q/pended/${k}">${esc(pendName(k))}<span class="n">${codes[k]}</span></a>`).join("");
  $("#nav").innerHTML = `<h4>Work</h4>${link(QUEUES[0])}${kids}${QUEUES.filter((q) => q.work && q.id !== "pended").map(link).join("")}
    <span class="q off" title="Provider disputes and member appeals aren't built.">Disputes<span class="tag">not built</span></span>
    <h4>Browse</h4>${QUEUES.filter((q) => q.browse).map(link).join("")}`;
}

// ---------- list ----------
function ageDays(c) { return Math.max(0, Math.floor((new Date(S.today) - new Date(c.received)) / 86400000)); }

function reasonChip(c, q) {
  if (c.status === "PENDED") return c.pends.map((p) => `<span class="chip todo">${esc(pendName(p.code))}</span>`).join(" ");
  return decisionChips(c);
}

function renderList(q, code, isSearch) {
  let rows = S.claims.filter(q.test);
  if (code) rows = rows.filter((c) => c.pends.some((p) => p.code === code));
  if (q.work) rows.sort((x, y) => ageDays(y) - ageDays(x));
  else rows = rows.slice().reverse();
  const title = isSearch ? `Search` : code ? pendName(code) : q.label;
  const body = rows.length ? `<div class="tablewrap"><table class="list"><thead><tr>
      <th>Claim</th><th>Member</th><th>Service</th><th>Provider</th><th class="r">Billed</th><th>${q.work ? "Reason" : "Status"}</th><th class="r">Age</th></tr></thead><tbody>` +
    rows.map((c) => {
      const age = ageDays(c);
      return `<tr data-claim="${esc(c.id)}" class="${fresh.has(c.id) ? "changed" : ""}">
        <td><span class="id num">${esc(c.number)}</span>${c.correction && !c.correction.original ? ` <span class="chip corr open" title="Correction; original not linked">corr · unlinked</span>` : ""}</td>
        <td>${esc(c.member)}</td>
        <td>${esc(c.procedure)} <span class="sub">· ${esc(c.dos.slice(5).replace("-", "/"))}</span></td>
        <td>${esc(c.provider)}</td>
        <td class="r num">${usd(c.charge)}</td>
        <td>${reasonChip(c, q)}</td>
        <td class="r num age ${q.work && age >= 5 ? "old" : ""}">${age ? age + "d" : "today"}</td></tr>`;
    }).join("") + `</tbody></table></div>`
    : `<div class="clear"><b>${q.work ? "Queue is clear" : "Nothing here"}</b>${q.work ? "Nothing needs an examiner right now." : ""}</div>`;
  $("#main").innerHTML = `<div class="head"><h1>${esc(title)}</h1><span class="muted">${rows.length}</span></div><div class="panel">${body}</div>`;
}

// ---------- claim ----------
function barHTML(c) {
  const seg = (cls, amount) => amount > 0 ? `<div class="seg ${cls}" style="flex-grow:${amount}"></div>` : "";
  if (c.status === "PENDED" || c.status === "RECEIVED") return `<div class="bar"><div class="seg pended" style="flex-grow:1"></div></div>`;
  if (c.outcome === "DENIED") return `<div class="bar"><div class="seg denied" style="flex-grow:1"></div></div>`;
  return `<div class="bar">${seg("plan", c.paid)}${seg("member", c.memberOwes)}${seg("writeoff", c.charge - c.allowed)}</div>`;
}

function trackHTML(c) {
  const pay = c.payment ? c.payment.state : "";
  const everPended = c.status === "PENDED" || c.history.some((h) => h.outcome.startsWith("PENDED"));
  const decided = c.status === "ADJUDICATED";
  const nodes = [["Received", true, ""]];
  if (everPended) nodes.push(["Pended", true, "warn"]);
  nodes.push([OUTCOME_LABEL[c.outcome] || "Adjudicated", decided, c.outcome === "DENIED" ? "bad" : c.outcome === "PARTIALLY_DENIED" ? "warn" : ""]);
  if (c.outcome !== "DENIED" && c.outcome !== "VOID") {
    nodes.push(["Selected", !!pay, ""], ["Paid", ["ISSUED", "CLEARED", "RETURNED", "VOIDED"].includes(pay), ""]);
    nodes.push(pay === "RETURNED" || pay === "VOIDED" ? ["Returned", true, "bad"] : ["Cleared", pay === "CLEARED", ""]);
  }
  if (c.superseded === "REPLACEMENT") nodes.push(["Replaced", true, "warn"]);
  if (c.superseded === "VOID") nodes.push(["Voided", true, "bad"]);
  return `<div class="track">` + nodes.map(([l, on, cls]) => `<span class="${on ? "on" : ""} ${cls}">${l}</span>`).join("<b></b>") + `</div>`;
}

function workHTML(c) {
  let html = "";
  for (const [i, p] of c.pends.entries()) {
    const help = PEND_HELP[p.code] || p.message;
    const act = p.overridable
      ? `<input data-note="${i}" placeholder="Note, e.g. auth PA-7731 confirmed by phone"><button class="btn primary small" data-override="${i}">Override &amp; reprocess</button>`
      : `<button class="btn small" data-recheck>Reprocess</button>`;
    html += `<div class="work"><h3>${esc(pendName(p.code))}</h3><p>${esc(p.message)}</p>
      <div class="do">${act}</div>${help !== p.message ? `<div class="hint" style="margin-top:8px">${esc(help)}</div>` : ""}</div>`;
  }
  if (c.superseded === "REPLACEMENT") html += `<div class="note">Superseded: replaced by ${esc(c.supersededBy || "a later claim")}. Its own decision stands as history.</div>`;
  if (c.superseded === "VOID") html += `<div class="note">Superseded: voided by ${esc(c.supersededBy || "a later claim")}. Its own decision stands as history.</div>`;
  for (const l of c.lines) if (l.denial) html += `<div class="note red">${esc(l.denial)}</div>`;
  return html;
}

// ---------- the claim as submitted ----------
const daySpan = (from, to) => to ? `${day(from)} – ${day(to)}` : day(from);
// ICD-10-CM is sent without its decimal point.
const dx = (code) => code.length > 3 && !code.includes(".") ? code.slice(0, 3) + "." + code.slice(3) : code;
const pair = (k, v, mono) => v ? `<div class="pair"><span>${k}</span><span${mono ? ` class="mono"` : ""}>${esc(v)}</span></div>` : "";
const GENDER = { F: "Female", M: "Male", U: "Unknown" };
const SOURCE = { EDI_837: "EDI 837", PAPER: "Paper", PORTAL: "Portal", API: "API" };

// The new fields are read from the stored claim itself (c.raw, the claim
// as protojson): they are as sent, so there is nothing to derive.
const tc = (x) => String(x || "").toLowerCase().replace(/(^|[\s\-'.])[a-z]/g, (m) => m.toUpperCase());
const pdate = (d) => d && d.year ? day(`${String(d.year).padStart(4, "0")}-${String(d.month).padStart(2, "0")}-${String(d.day).padStart(2, "0")}`) : "";
const cents = (m) => m ? Number(m.cents || 0) : null;
const humanize = (k) => k.replace(/([A-Z])/g, " $1").toLowerCase().replace(/^./, (x) => x.toUpperCase());
const en = (v, prefix) => String(v || "").replace(prefix, "");
const zip = (z) => /^\d{9}$/.test(z || "") ? z.slice(0, 5) + "-" + z.slice(5) : z || "";
const addrText = (a) => a ? [...(a.lines || []), a.city, [a.state, zip(a.postalCode)].filter(Boolean).join(" "), a.countryCode].filter(Boolean).join(", ") : "";
const contactText = (ct) => [ct.name, ...(ct.numbers || []).map((n) => `${n.qualifier} ${n.value}`)].filter(Boolean).join(" · ");
const maskId = (v) => "•••-••-" + String(v).slice(-4);
const REL = { SELF: "Self", SPOUSE: "Spouse", CHILD: "Child", EMPLOYEE: "Employee", LIFE_PARTNER: "Life partner", ORGAN_DONOR: "Organ donor", CADAVER_DONOR: "Cadaver donor", OTHER: "Other", NOT_KNOWN: "Not known" };
const relWord = (p) => p && p.relationshipCode ? REL[en(p.relationship, "PATIENT_RELATIONSHIP_")] || "Relationship " + p.relationshipCode : "";
const SEQ = { PRIMARY: "Primary", SECONDARY: "Secondary", TERTIARY: "Tertiary", FOURTH_OR_LATER: "Fourth or later", NOT_KNOWN: "Order not known" };
const seqWord = (x) => x && x.payerResponsibilityCode ? SEQ[en(x.payerResponsibility, "PAYER_RESPONSIBILITY_")] || "Sequence " + x.payerResponsibilityCode : "";
const CAUSE = { AUTO_ACCIDENT: "Auto accident", EMPLOYMENT: "Employment", OTHER_ACCIDENT: "Other accident" };
const adjText = (a) => `${a.groupCode}-${a.reasonCode} ${usd(cents(a.amount))}`;

function partyBox(title, p, chips) {
  const tin = p.tin ? (p.taxIdQualifier === "SY" ? maskId(p.tin) : p.tin) : "";
  const more = [addrText(p.address), ...(p.contacts || []).map(contactText), ...(p.secondaryIds || []).map((i) => `Id ${i.qualifier} ${i.value}`)].filter(Boolean);
  return `<div class="box"><small>${title}</small><b>${esc(tc(p.name) || "–")}</b>
    ${pair("NPI", p.npi, true)}${pair("TIN", tin, true)}${pair("Taxonomy", p.taxonomyCode, true)}${chips || ""}
    ${more.length ? `<details class="mini"><summary>Address, contacts, ids</summary>${more.map((x) => `<div class="sub">${esc(x)}</div>`).join("")}</details>` : ""}</div>`;
}

const FREQUENCY = { ORIGINAL: "Original", REPLACEMENT: "Corrected claim", VOID: "Void" };
const fact = (label, main, ...subs) => `<div class="fact"><small>${label}</small><b>${main || "–"}</b>${subs.filter(Boolean).map((x) => `<span class="sub">${x}</span>`).join("")}</div>`;
const born = (p) => [p.born && "Born " + day(p.born), GENDER[p.gender] || p.gender].filter(Boolean).map(esc).join(" · ");

// Every submitted field, for the "All submitted fields" disclosure: the
// stored claim minus what we decided, with SSNs masked.
const DECIDED = new Set(["id", "customerId", "memberId", "subscriberId", "originalClaimId", "status", "adjudication", "adjudicationHistory", "payment", "pendOverrides", "originalLink", "supersededBy", "audit", "sourceRecord", "claimNumber", "claimVersion", "providerId"]);
const isDate = (v) => v && typeof v === "object" && "year" in v && "month" in v;
const isMoney = (v) => v && typeof v === "object" && Object.keys(v).length === 1 && "cents" in v;
const isRange = (v) => v && typeof v === "object" && (isDate(v.start) || isDate(v.end)) && Object.keys(v).every((k) => k === "start" || k === "end");
function leafText(k, v) {
  if (/ssn$/i.test(k)) return maskId(v);
  if (isDate(v)) return pdate(v);
  if (isMoney(v)) return usd(cents(v));
  if (isRange(v)) return [pdate(v.start), pdate(v.end)].filter(Boolean).join(" – ");
  if (typeof v === "string" && /^[A-Z0-9]+(_[A-Z0-9]+)+$/.test(v)) {
    const stem = k.replace(/([A-Z])/g, "_$1").toUpperCase() + "_";
    const at = v.indexOf(stem);
    return words(at >= 0 ? v.slice(at + stem.length) : v);
  }
  return String(v);
}
function treeHTML(obj) {
  let html = "";
  for (const [k, v] of Object.entries(obj)) {
    if (DECIDED.has(k) || v == null || v === "") continue;
    const scalar = (x) => typeof x !== "object" || isDate(x) || isMoney(x) || isRange(x);
    const group = (title, x) => { const inner = treeHTML(x); return inner ? `<div class="tgroup"><div class="tk">${esc(title)}</div>${inner}</div>` : ""; };
    if (Array.isArray(v)) {
      if (!v.length) continue;
      html += v.every(scalar) ? `<div class="kv wide"><span>${esc(humanize(k))}</span><span>${v.map((x) => esc(leafText(k, x))).join(", ")}</span></div>`
        : v.map((x, i) => group(`${humanize(k)} ${i + 1}`, x)).join("");
    } else if (scalar(v)) html += `<div class="kv wide"><span>${esc(humanize(k))}</span><span>${esc(leafText(k, v))}</span></div>`;
    else html += group(humanize(k), v);
  }
  return html;
}

// The claim as submitted, top down: the claim itself (who, when, what
// kind, how it reached us, what it is about), other insurance, then the
// providers on it. Lines follow below. Detail sits behind a click.
function submittedHTML(c) {
  const s = c.submitted, R = c.raw || {};
  if (!s) return "";
  const match = c.memberId
    ? `<span class="chip APPROVED" title="Matched member">✓ ${esc(c.member)}</span>`
    : `<span class="chip todo">No member matched</span>`;
  const number = (p) => p.memberNumber ? `<span class="mono">${esc(p.memberNumber)}</span>` : "";
  const cov = R.submittedCoverage || {}, payer = R.submittedPayer, group = cov.groupNumber || cov.groupName ? "Group " + esc(cov.groupNumber || cov.groupName) : "";
  const rel = relWord(R.submittedPatient);
  let who;
  if (s.patient) who = fact("Patient", esc(s.patient.name), rel ? esc(rel) + " of the subscriber" : "", born(s.patient), match) + (s.subscriber ? fact("Subscriber", esc(s.subscriber.name), number(s.subscriber), group, born(s.subscriber)) : "");
  else if (s.subscriber) who = fact("Patient (the subscriber)", esc(s.subscriber.name), number(s.subscriber), group, born(s.subscriber), match);
  else who = fact("Patient", esc(c.member), D.card ? `<span class="mono">${esc(D.card)}</span>` : "", c.memberId ? "" : match);

  const pos = [...new Set([R.placeOfServiceCode, ...c.lines.map((l) => l.pos)].filter(Boolean))];
  const i = s.institutional, in_ = c.intake, txn = R.submittedTransaction || {};
  const kind = { ENCOUNTER: "Encounter (no payment expected)", SUBROGATION_DEMAND: "Subrogation demand" }[en(txn.type, "TRANSACTION_TYPE_")];
  let facts = who +
    fact("Service dates", esc(daySpan(s.from, s.to)), pos.length ? "Place of service " + esc(pos.join(", ")) : "") +
    fact("Claim type", esc(words(s.type).replace(/^./, (x) => x.toUpperCase())), esc(FREQUENCY[c.frequency] || ""), kind ? esc(kind) : "") +
    fact("Received", esc(day(c.received.slice(0, 10))), s.timelyFiling ? "Timely filing from " + esc(day(s.timelyFiling)) : "") +
    fact("Submitted by", esc(SOURCE[s.source] || "–"), in_ && in_.clearinghouse ? "via " + esc(in_.clearinghouse) : "");
  if (payer || cov.payerResponsibilityCode) facts += fact("Billed to", esc(tc(payer && payer.name) || "–"), payer && payer.id ? `<span class="mono">${esc(payer.id)}</span>` : "",
    [seqWord(cov), cov.claimFilingIndicatorCode && "filing " + cov.claimFilingIndicatorCode].filter(Boolean).map(esc).join(" · "));
  if (s.pcn) facts += fact("Patient control #", `<span class="mono">${esc(s.pcn)}</span>`);

  // What the claim is about and who is to be paid.
  const rc = R.relatedCauses, dates = R.dates || {}, ind = R.indicators || {};
  if (rc) facts += fact("Related to", `<span class="chip todo">${esc((rc.causes || []).map((x, n) => CAUSE[en(x, "RELATED_CAUSE_")] || rc.causeCodes[n]).join(", "))}</span>`,
    dates.accident ? "Accident " + esc(pdate(dates.accident)) : "", rc.autoAccidentState ? "in " + esc(rc.autoAccidentState) : "");
  if (ind.benefitsAssignmentCode || ind.acceptAssignmentCode) {
    const ben = { YES: "Pay the provider", NO: "Pay the member", NOT_APPLICABLE: "Assignment not applicable" }[en(ind.benefitsAssignment, "BENEFITS_ASSIGNMENT_")] || "Benefits code " + ind.benefitsAssignmentCode;
    const acc = { ASSIGNED: "Provider accepts assignment", CLINICAL_LAB_ONLY: "Accepts assignment for lab only", NOT_ASSIGNED: "Provider does not accept assignment" }[en(ind.acceptAssignment, "ACCEPT_ASSIGNMENT_")];
    facts += fact("Payment goes to", esc(ind.benefitsAssignmentCode ? ben : "–"), acc ? esc(acc) : "");
  }
  if (R.patientPaid) facts += fact("Patient already paid", usd(cents(R.patientPaid)));
  const otherDates = Object.entries(dates).filter(([k]) => k !== "accident").map(([k, v]) => `${esc(humanize(k))} ${esc(leafText(k, v))}`);
  if (otherDates.length) facts += fact("Dates", otherDates[0], ...otherDates.slice(1));
  const refs = Object.entries(R.references || {}).map(([k, v]) => `${esc(humanize(k).replace(/ number$/, ""))} <span class="mono">${esc(v)}</span>`);
  if (refs.length) facts += fact("References", refs[0], ...refs.slice(1));
  if (i) facts += fact("Type of bill", `<span class="mono">${esc(i.typeOfBill)}</span>`, i.drg ? "DRG " + esc(i.drg) : "") +
    fact("Stay", esc(daySpan(i.admitted, i.discharged)), i.admissionType ? "Admission type " + esc(i.admissionType) : "", i.dischargeStatus ? "Discharge status " + esc(i.dischargeStatus) : "");

  const chips = (label, list) => list.length ? `<small>${label}</small>` + list.join("") : "";
  const codes = chips("Diagnoses", s.diagnoses.map((d, n) => `<span class="code ${n ? "" : "first"}" title="${n ? "" : "Principal"}">${esc(dx(d))}</span>`)) +
    chips("Authorization", s.auths.map((a) => `<span class="code">${esc(a)}</span>`)) +
    chips("Attachments", (R.attachments || []).map((a) => `<span class="code" title="Report type ${esc(a.reportTypeCode)}, sent ${esc(a.transmissionCode)}">${esc(a.controlNumber || a.reportTypeCode)}</span>`)) +
    chips("Conditions", (R.conditionCodes || []).map((x) => `<span class="code">${esc(x)}</span>`));
  const notes = (R.notes || []).map((n) => `<div class="said">${esc(n.text)}</div>`).join("");

  // Other payers on the claim, and what each already did with it.
  const other = (R.otherInsurance || []).map((o) => {
    const p = o.payer || {}, sub = o.subscriberName ? tc([o.subscriberName.first, o.subscriberName.last].filter(Boolean).join(" ")) : "";
    return `<div class="box"><small>${esc(seqWord(o) || "Other payer")}${o.adjudicationDate ? " · processed " + esc(pdate(o.adjudicationDate)) : ""}</small>
      <b>${esc(tc(p.name) || "–")} <span class="sub mono" style="font-weight:400">${esc(p.id || "")}</span></b>
      ${o.payerPaid ? pair("Paid", usd(cents(o.payerPaid))) : ""}${o.nonCovered ? pair("Not covered", usd(cents(o.nonCovered))) : ""}${o.remainingPatientLiability ? pair("Patient still owes", usd(cents(o.remainingPatientLiability))) : ""}
      ${pair("Their claim #", o.claimControlNumber, true)}${pair("Subscriber", [sub, o.subscriberId].filter(Boolean).join(" · "))}${pair("Patient is", relWord(o))}${pair("Group", o.groupNumber || o.groupName, true)}
      ${(o.adjustments || []).length ? `<div class="cas" style="margin-top:6px">${o.adjustments.map(adjText).map(esc).join(" · ")}</div>` : ""}</div>`;
  }).join("");

  const tier = c.tier === "INN" ? `<span class="chip APPROVED">In-network</span>` : c.tier === "OON" ? `<span class="chip todo">Out-of-network</span>` : "";
  const prov = (title, p, chip) => p ? partyBox(title, p, chip) : "";
  const billing = R.billingProvider;
  let providers = prov("Billing", billing, billing ? (billing.providerId ? "" : `<span class="chip todo">Not in provider data</span> `) + tier : "") +
    prov("Rendering", R.renderingProvider) + prov("Referring", R.referringProvider) + prov("Primary care", R.primaryCareProvider) +
    prov("Service facility", R.serviceFacility) + prov("Supervising", R.supervisingProvider) + prov("Facility", R.facility);
  if (R.payToAddress) providers += `<div class="box"><small>Pay-to address</small><div style="font-size:13px;margin-top:2px">${esc(addrText(R.payToAddress))}</div></div>`;

  const unmapped = R.unmappedSegments || [];
  const all = treeHTML(Object.fromEntries(Object.entries(R).filter(([k]) => k !== "lines" && k !== "unmappedSegments")));
  return `<div class="panel" style="margin-bottom:12px">
    <div class="section"><div class="label">Claim as submitted</div><div class="facts">${facts}</div>${codes ? `<div class="codes">${codes}</div>` : ""}${notes}</div>
    ${other ? `<div class="section"><div class="label">Other insurance</div><div class="boxes wide">${other}</div></div>` : ""}
    ${providers ? `<div class="section"><div class="label">Providers</div><div class="boxes">${providers}</div></div>` : ""}
    ${unmapped.length ? `<div class="section"><div class="label" style="color:var(--amber)">Sent but not mapped to a field</div>${unmapped.map((u) => `<div class="mono">${esc(u)}</div>`).join("")}</div>` : ""}
    <div class="section"><details class="mini"><summary>All submitted fields</summary><div class="tree">${all}</div></details></div></div>`;
}

function linesHTML(c) {
  const s = c.submitted || {}, R = c.raw || {};
  const payerName = (id) => { const o = (R.otherInsurance || []).find((x) => (x.payer || {}).id === id); return tc(o && o.payer.name) || id; };
  return `<table class="lines"><thead><tr><th>Line</th><th>Service</th><th class="r">Billed</th><th class="r">Allowed</th><th>Member</th><th class="r">Plan pays</th></tr></thead><tbody>` +
    c.lines.map((l, n) => {
      const decided = l.status === "PAYABLE";
      const member = decided ? (l.shares.length ? l.shares.map((s) => `${usd(s.amount)} <span class="sub">${esc(s.type)}</span>`).join("<br>") : `<span class="sub">none</span>`) : "";
      const r = (R.lines || [])[n] || {}, drug = r.drug || {}, refs = r.references || {};
      const flags = [r.emergencyIndicator === "Y" && "Emergency", r.epsdtIndicator === "Y" && "EPSDT", r.familyPlanningIndicator === "Y" && "Family planning"].filter(Boolean);
      const who = [["Rendering", r.renderingProvider], ["Ordering", r.orderingProvider], ["Referring", r.referringProvider], ["Supervising", r.supervisingProvider], ["Facility", r.serviceFacility], ["Purchased from", r.purchasedServiceProvider]]
        .filter(([, p]) => p).map(([t, p]) => `${t} ${esc(tc(p.name) || p.npi)}`);
      const extra = [
        r.procedureDescription && esc(r.procedureDescription),
        (drug.quantity || drug.prescriptionNumber) && `Drug ${esc([drug.quantity, drug.unitCode].filter(Boolean).join(" "))}${drug.prescriptionNumber ? ` · Rx ${esc(drug.prescriptionNumber)}` : ""}`,
        who.join(" · "),
        refs.lineItemControlNumber && `Line control # <span class="mono">${esc(refs.lineItemControlNumber)}</span>`,
        ...(r.otherPayerAdjudications || []).map((a) => `${esc(payerName(a.payerId))} paid ${usd(cents(a.paid) || 0)}${(a.adjustments || []).length ? ` · <span class="cas">${a.adjustments.map(adjText).map(esc).join(" · ")}</span>` : ""}${a.remainingPatientLiability ? ` · patient owes ${usd(cents(a.remainingPatientLiability))}` : ""}`),
      ].filter(Boolean);
      const all = treeHTML(Object.fromEntries(Object.entries(r).filter(([k]) => k !== "adjudication")));
      return `<tr><td>${l.number}</td>
        <td><b>${esc(l.procedure)}</b>${l.modifiers.map((m) => ` <span class="code" title="Modifier">${esc(m)}</span>`).join("")} <span class="sub">${l.units ? `× ${esc(l.units)} ` : ""}· POS ${esc(l.pos)}${l.revenue ? ` · rev ${esc(l.revenue)}` : ""}</span>${flags.map((f) => ` <span class="chip todo">${f}</span>`).join("")}
          ${l.from && (l.from !== s.from || (l.to || "") !== (s.to || "")) ? `<div class="sub">${daySpan(l.from, l.to)}</div>` : ""}
          ${l.diagnoses.length || l.ndc ? `<div class="codes" style="margin-top:4px">${l.diagnoses.map((d) => `<span class="code">${esc(dx(d))}</span>`).join("")}${l.ndc ? `<span class="code" title="NDC">NDC ${esc(l.ndc)}</span>` : ""}</div>` : ""}
          ${extra.map((x) => `<div class="sub">${x}</div>`).join("")}${(r.notes || []).map((x) => `<div class="said">${esc(x.text)}</div>`).join("")}
          ${l.benefit ? `<div class="sub">${esc(l.benefit)}</div>` : ""}${l.cas.length || l.remarks.length ? `<div class="cas">${l.cas.concat(l.remarks).map(esc).join(" · ")}</div>` : ""}
          ${all ? `<details class="mini"><summary>All line fields</summary><div class="tree">${all}</div></details>` : ""}</td>
        <td class="r num">${usd(l.charge)}</td>
        <td class="r num">${decided ? usd(l.allowed) : "–"}${l.pricing ? `<div class="sub" style="white-space:nowrap">${esc(l.pricing.split(",")[0])}</div>` : ""}</td>
        <td class="num">${decided ? member : `<span class="chip ${l.status === "DENIED" ? "DENIED" : "PENDED"}">${words(l.status)}</span>`}</td>
        <td class="r num">${decided ? usd(l.paid) : "–"}</td></tr>`;
    }).join("") + `</tbody></table>`;
}

function sideHTML(d) {
  const c = d.claim, acc = d.accumulators;
  let meters = "";
  if (acc && acc.rows) {
    const fam = acc.rows[0];
    const me = acc.rows.find((r, i) => i > 0 && r.owner === c.member);
    const m = (label, cell) => {
      if (!cell) return "";
      const pct = Math.min(100, Math.round(cell.applied / cell.limit * 100));
      return `<div class="meter"><div class="row"><span>${label}</span><span class="num">${usd(cell.applied)} <span class="sub">/ ${usd(cell.limit)}</span></span></div>
        <div class="track2"><i class="${pct >= 100 ? "full" : ""}" style="width:${pct}%"></i></div></div>`;
    };
    const tier = c.tier === "OON" ? 2 : 0;
    const tierName = c.tier === "OON" ? "Out-of-network" : "In-network";
    meters = `<div class="label">${tierName} accumulators</div>` +
      m(`${esc(c.member)} deductible`, me && me.cells[tier]) + m("Family deductible", fam.cells[tier]) +
      m(`${esc(c.member)} out-of-pocket`, me && me.cells[tier + 1]) + m("Family out-of-pocket", fam.cells[tier + 1]);
  }
  const tl = d.timeline.length ? `<ul class="tl">` + d.timeline.map((e) =>
    `<li><details><summary>${esc(e.title)}</summary>${e.lines.length ? `<ul>${e.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}${e.error ? `<div class="err">${esc(e.error)}</div>` : ""}</details></li>`).join("") + `</ul>`
    : `<div class="sub">No activity.</div>`;
  const rel = d.related.length ? `<div class="section"><div class="label">Other versions</div><div class="rel">${d.related.map((r) => `<a href="${esc(claimHref(r))}">${esc(r.number)}</a>`).join("")}</div></div>` : "";
  const i = c.intake;
  const kv = (k, v) => v ? `<div class="kv"><span>${k}</span><span>${v}</span></div>` : "";
  const intake = i ? `<div class="section"><div class="label">Received</div>
    ${kv("File", `<a href="/claims-intake/#/job/${esc(i.jobId)}" target="_blank">${esc(i.filename)}</a> <span class="sub">set ${esc(i.set)}</span>`)}
    ${kv("From", esc(i.clearinghouse) + (i.clearinghouseReceived ? ` <span class="sub">${esc(new Date(i.clearinghouseReceived).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "UTC" }))}</span>` : ""))}
    ${kv("Trace #", i.trace ? `<span class="mono">${esc(i.trace)}</span>` : "")}
    ${kv("Quoted claim #", i.quoted ? `<span class="mono">${esc(i.quoted)}</span>` : "")}
  </div>` : "";
  return `<div class="panel">${meters ? `<div class="section">${meters}</div>` : ""}${rel}${intake}<div class="section"><div class="label">Activity</div>${tl}</div></div>`;
}

// The badge on a replacement or void: what it corrects, or that it isn't
// linked yet.
function corrHTML(c) {
  const k = c.correction;
  if (!k) return "";
  const what = k.kind === "void" ? "Void" : "Correction";
  if (!k.original) {
    return `<div class="corr open">${what} · original not linked${k.quoted ? ` <span class="sub">provider quoted <span class="mono">${esc(k.quoted)}</span></span>` : ""}</div>`;
  }
  const verb = k.kind === "void" ? "Voids" : "Corrects";
  const how = k.match === "linked" ? "linked" : k.quoted && k.quoted !== k.original ? `provider quoted ${k.quoted}` : "";
  return `<div class="corr">${verb} <a href="${esc(claimHref({ id: k.originalId, number: k.original }))}" class="mono">${esc(k.original)}</a>${how ? ` <span class="sub">${esc(how)}</span>` : ""}</div>`;
}

function renderClaim() {
  const c = D.claim;
  const final = c.actions.includes("adjust");
  const decided = !["PENDED", "RECEIVED"].includes(c.status);
  const backQ = QUEUES.find((q) => q.id === lastQueue.split("/")[0]);
  $("#main").innerHTML = `
    <a class="back" href="#/q/${esc(lastQueue)}">← ${esc(backQ ? (lastQueue.includes("/") ? pendName(lastQueue.split("/")[1]) : backQ.label) : "Back")}</a>
    <div class="claimhead">
      <div><h1 class="num">${esc(c.number)} ${decisionChips(c, ` style="vertical-align:4px"`)}</h1>
        ${corrHTML(c)}
        <div class="who">${[c.member, D.card, c.provider, c.dos].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="tools">${final ? `<button class="btn" data-act="adjust">Adjust…</button><button class="btn" data-act="void">Void…</button>` : ""}${c.actions.includes("reopen") ? `<button class="btn" data-act="reopen" title="Nothing has been reported yet: back to pended, to be re-run in place">Reopen…</button>` : ""}</div>
    </div>
    <div class="cols">
      <div>
        ${workHTML(c)}
        ${submittedHTML(c)}
        <div class="panel ${fresh.has(c.id) ? "changed" : ""}">
          <div class="section">
            <div class="money">
              <div><small>Billed</small><b class="num">${usd(c.charge)}</b></div>
              <div><small>Allowed</small><b class="num">${decided ? usd(c.allowed) : "–"}</b></div>
              <div><small>Member owes</small><b class="num" style="color:var(--member)">${decided ? usd(c.memberOwes) : "–"}</b></div>
              <div><small>Plan pays</small><b class="num" style="color:var(--plan)">${decided ? usd(c.paid) : "–"}</b></div>
            </div>
            ${barHTML(c)}${trackHTML(c)}
          </div>
          <div class="section">${linesHTML(c)}</div>
        </div>
      </div>
      <div>${sideHTML(D)}</div>
    </div>`;
}

// ---------- actions ----------
let toastTimer;
function toast(text, bad) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "toast" + (bad ? " bad" : "");
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), bad ? 6000 : 3500);
}

// Run an action and refresh. Returns the result.
async function act(a, quiet) {
  let res;
  try { res = await post("api/action", a); } catch (e) { toast(e.message, true); return null; }
  if (!res.ok) { toast(res.error, true); return res; }
  if (!quiet && !a.preview) toast(summary(res));
  if (!a.preview) await load();
  return res;
}

// The most useful line of a result: the claim's new decision if there is one.
function summary(res) {
  const pick = res.lines.find((l) => / adjudicated \(run/.test(l)) || res.lines[res.lines.length - 1] || res.title;
  return pick.replace(/ \(run \d+\)/, "").replace(/, allowed [^,]+/, "");
}

document.addEventListener("click", async (ev) => {
  const t = ev.target;
  const row = t.closest("[data-claim]");
  if (row) return goToClaim(row.dataset.claim);
  if (!D) return;
  const c = D.claim;
  const o = t.closest("[data-override]");
  if (o) {
    const p = c.pends[+o.dataset.override];
    const note = $(`[data-note="${o.dataset.override}"]`).value.trim();
    if (!note) return toast("Add a note saying why you're overriding.", true);
    return act({ type: "reprocess", claimId: c.id, reason: note, resolve: [{ code: p.code, line: p.line }] });
  }
  if (t.closest("[data-recheck]")) return act({ type: "reprocess", claimId: c.id, reason: "Rechecked after data update" });
  const a = t.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "adjust") return adjustDialog(c);
  if (a.dataset.act === "dryadjust") {
    const res = await act({ type: "adjust", claimId: c.id, reason: "Preview", preview: true });
    if (res && res.ok) showDelta(res);
    return;
  }
  if (a.dataset.act === "void") return voidDialog(c);
  if (a.dataset.act === "reopen") return reopenDialog(c);
});

const dlg = $("#dlg");
function dialog(html, onSubmit) {
  dlg.innerHTML = html;
  const f = dlg.querySelector("form");
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const mode = ev.submitter ? ev.submitter.value : "";
    if (mode === "cancel") return dlg.close();
    const err = await onSubmit(Object.fromEntries(new FormData(f)), mode);
    const out = f.querySelector(".formerr");
    // "keep" leaves the dialog open (e.g. after a preview) without an error.
    if (err === "keep") { if (out) out.textContent = ""; }
    else if (err) { if (out) out.textContent = err; }
    else dlg.close();
  };
  dlg.showModal();
}

function showDelta(res) {
  const d = res.delta, p = res.preview;
  dialog(`<form><h3>If re-adjudicated today</h3>
    <div class="money" style="grid-template-columns:repeat(3,1fr)">
      <div><small>Outcome</small><b style="font-size:15px"><span class="chip ${decision(p)}">${words(decision(p))}</span></b></div>
      <div><small>Member owes</small><b class="num">${usd(p.memberOwes)}</b></div>
      <div><small>Plan pays</small><b class="num">${usd(p.paid)}</b></div></div>
    <div class="delta"><b class="num">${usd(d.delta)}</b> <span class="muted">${d.delta < 0 ? "to recover" : d.delta > 0 ? "more to pay" : "no change"} · provider holds ${usd(d.original)} (${words(d.basis)})</span></div>
    <div class="actions"><button class="btn" value="cancel">Close</button><button class="btn primary" value="go">Adjust now</button></div></form>`,
    (_, mode) => { if (mode === "go") setTimeout(() => adjustDialog(D.claim), 0); return ""; });
}

function adjustDialog(c) {
  const line = c.lines[0];
  const auth = (c.raw.authorizationNumbers || [])[0] || "";
  dialog(`<form><h3>Adjust ${esc(c.number)}</h3><div class="grid2">
      <label>Procedure<input name="procedure" value="${esc(line.procedure)}" required></label>
      <label>Billed ($)<input name="charge" type="number" min="1" step="0.01" value="${line.charge / 100}" required></label>
      <label>Date of service<input name="dos" type="date" value="${esc(c.dos)}" required></label>
      <label>Authorization<input name="auth" value="${esc(auth)}"></label>
      <label class="wide">Reason<input name="reason" required placeholder="e.g. Provider corrected the procedure code"></label></div>
    <div id="preview"></div><div class="formerr"></div>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn" value="dry">Preview</button><button class="btn primary" value="go">Adjust</button></div></form>`,
    async (d, mode) => {
      const spec = {};
      if (d.procedure.trim() !== line.procedure) spec.procedure = d.procedure.trim();
      if (Math.round(d.charge * 100) !== line.charge) spec.charge = Math.round(d.charge * 100);
      if (d.dos !== c.dos) spec.dos = d.dos;
      if (d.auth.trim() !== auth) spec.auth = d.auth.trim();
      const a = { type: "adjust", claimId: c.id, reason: d.reason };
      if (Object.keys(spec).length) a.claim = spec;
      if (mode === "dry") {
        a.preview = true;
        const res = await act(a, true);
        if (!res || !res.ok) return res ? res.error : "Request failed.";
        const x = res.delta, p = res.preview;
        $("#preview").innerHTML = `<div class="delta"><span class="chip ${decision(p)}">${words(decision(p))}</span> plan pays <b class="num">${usd(p.paid)}</b>
          · <span class="num">${usd(x.delta)}</span> <span class="muted">${x.delta < 0 ? "to recover" : x.delta > 0 ? "more to pay" : "no change"}</span></div>`;
        return "keep";
      }
      const res = await act(a);
      if (!res || !res.ok) return res ? res.error : "Request failed.";
      if (res.claimId) goToClaim(res.claimId);
      return "";
    });
}

// Before a claim's payment run is released nothing has been reported, so
// it is reopened and re-run in place: no new version.
function reopenDialog(c) {
  dialog(`<form><h3>Reopen ${esc(c.number)}</h3>
    <p class="sub">Back to pended${c.payment ? ", out of the payment run" : ""}. Its accumulator postings are reversed. Reprocess it to decide it again.</p>
    <label>Reason<input name="reason" required placeholder="e.g. Visit level in question"></label>
    <div class="formerr"></div>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="go">Reopen claim</button></div></form>`,
    async (d) => {
      const res = await act({ type: "reopen", claimId: c.id, reason: d.reason });
      return !res ? "Request failed." : res.ok ? "" : res.error;
    });
}

function voidDialog(c) {
  dialog(`<form><h3>Void ${esc(c.number)}</h3>
    <label>Reason<input name="reason" required placeholder="e.g. Billed in error"></label>
    <div class="formerr"></div>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="go">Void claim</button></div></form>`,
    async (d) => {
      const res = await act({ type: "void", claimId: c.id, reason: d.reason });
      if (res && res.ok && res.claimId) goToClaim(res.claimId);
      return !res ? "Request failed." : res.ok ? "" : res.error;
    });
}

$("#q").addEventListener("input", (ev) => {
  const v = ev.target.value;
  // Members and Network filter their own lists; elsewhere it searches claims.
  if (TAB === "members" || TAB === "network") {
    FILTER = v;
    const list = "#/" + TAB, [, kind] = location.hash.split("/");
    if (kind === "member" || kind === "provider" || (TAB === "network" && location.hash.endsWith("/networks"))) return void (location.hash = list);
    return void route();
  }
  location.hash = v ? "#/search/" + encodeURIComponent(v) : "#/q/" + lastQueue;
});
$("#reset").onclick = async () => { await post("api/reset"); prevClaims = {}; S = null; location.hash = "#/q/pended"; await load(); toast("Back to Monday morning: two weeks of claims, fresh queues."); };

if (!location.hash) location.hash = "#/q/pended";
load();
</script>
</body>
</html>
