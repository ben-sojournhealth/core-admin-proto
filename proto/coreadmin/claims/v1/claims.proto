syntax = "proto3";

package coreadmin.claims.v1;

import "coreadmin/claims/v1/claim_submission.proto";
import "coreadmin/common/v1/common.proto";
import "coreadmin/plan/v1/plan.proto";
import "coreadmin/provider/v1/provider.proto";
import "google/protobuf/timestamp.proto";

// Claim is a request for payment, modeled on the 837P/837I.
//
// Four separate facts describe where a claim stands:
//
//   status                where it is in processing
//   adjudication.outcome  what was decided
//   superseded_by         whether it is still the current version
//   payment               where the money is
//
// Status:
//
//   RECEIVED -> PENDED | ADJUDICATED     first adjudication
//   PENDED   -> PENDED | ADJUDICATED     ReprocessClaim
//
// A claim is adjudicated when no pend is open and every line is decided.
// That is the only point at which accumulators are posted.
//
// What happens to an adjudicated claim that needs to change depends on
// whether its result has been reported, which happens when its payment
// run is released (payment.state ISSUED or later):
//
//   Not yet released: nothing has been reported, so there is nothing to
//   reverse. ReopenClaim puts the same claim back to PENDED and it is
//   re-run in place. A provider's corrected claim or void (frequency 7 /
//   8) of it closes it as denied, replaced or voided by the provider, and
//   is itself decided as a claim of its own.
//
//   Released: the result stands as reported. Corrections and voids create
//   a new Claim that references the original (AdjustClaim, VoidClaim, or a
//   provider's frequency 7 / 8). When that claim is adjudicated the
//   original's superseded_by is set; its status and outcome stay as they
//   were, and the next 835 reverses what was reported.
//
// So every adjudicated result that reaches an 835 is reported once, and
// only a reported result is ever superseded. Payment (selection into a
// run, release, clearing, returns) is tracked in `payment`.
//
// Submitted versus matched: the fields a provider (or the 837) supplies are
// kept exactly as sent and are the only inputs adjudication reads. What
// adjudication matches them to (customer, member, original claim) is
// recorded on each run's Adjudication, and copied to the output-only
// fields below for convenience. Every run matches again from the
// submitted fields, so a rerun picks up changed member or claim data.
message Claim {
  string id = 1;
  // Output only: the customer of the matched member.
  string customer_id = 2;
  ClaimType type = 3;
  ClaimFrequency frequency = 4;
  // Output only: for a replacement or void, the original it replaces, as
  // matched by the current adjudication. Empty while unmatched.
  string original_claim_id = 5;
  // Provider-assigned patient control number (837 CLM01), echoed on the
  // 835. The payer's claim number is claim_number.
  string patient_control_number = 6;

  // Member id as submitted (2010BA NM109).
  string member_card_id = 7;
  // Output only: the matched member and their subscriber.
  string member_id = 8;
  string subscriber_id = 9;

  ProviderRef billing_provider = 10;
  ProviderRef rendering_provider = 11;
  ProviderRef referring_provider = 12;
  // Institutional only.
  ProviderRef facility = 13;

  // ICD-10-CM; the first is principal.
  repeated string diagnosis_codes = 14;
  common.v1.DateRange service_dates = 15;
  common.v1.Money total_charge = 16;
  repeated ClaimLine lines = 17;

  // Institutional fields.
  InstitutionalInfo institutional = 18;

  ClaimStatus status = 19;
  ClaimSource source = 20;
  // When the claim reached us (intake). Not necessarily the date timely
  // filing is measured from; see timely_filing_date.
  google.protobuf.Timestamp received_time = 21;
  // Prior authorization / referral numbers supplied by the provider.
  repeated string authorization_numbers = 22;

  // The current adjudication result. Output only: written by the engine,
  // never edited, and never an input to any later adjudication. Downstream
  // systems (accumulator ledger, stop-loss, remittance) keep their own
  // records by claim id and reverse from those.
  Adjudication adjudication = 23;

  // Clearinghouse that delivered the claim, for EDI submissions.
  string clearinghouse_id = 24;
  // When the clearinghouse accepted the claim from the provider. Commonly
  // the date timely filing is measured from, since the clearinghouse
  // acceptance report is the provider's proof of filing.
  google.protobuf.Timestamp clearinghouse_received_time = 25;
  // The date the timely filing limit is checked against, set at intake from
  // clearinghouse_received_time or received_time according to the
  // customer's / contract's rules.
  common.v1.Date timely_filing_date = 26;

  // Earlier adjudication runs, oldest first (each ReprocessClaim moves the
  // previous result here), so it stays visible why a claim pended.
  repeated Adjudication adjudication_history = 27;
  // Payment and remittance for this claim, written back by the payment
  // system so adjustment deltas can be computed from the claim alone.
  // Unset until a payment run selects the claim.
  ClaimPayment payment = 28;
  // Examiner decisions that let the claim past a pend (e.g. "prior auth
  // confirmed", "not a duplicate"). These are inputs to adjudication,
  // unlike the adjudication results.
  repeated PendOverride pend_overrides = 32;

  // The claim number people see (examiners, providers, the 835), assigned
  // at intake as YYJJJ-S-NNNNN: two-digit year, Julian day received, source
  // (E = EDI, P = paper, W = web portal) and a daily sequence, e.g.
  // 26075-E-00012. `id` is the internal key and is never shown.
  //
  // Every version of a claim shares its number: a replacement or void
  // keeps the original's claim_number and takes the next claim_version.
  string claim_number = 33;
  // 1 for the original; each replacement or void is the next version.
  // Displayed as a suffix from 2 on: 26075-E-00012-2.
  int32 claim_version = 34;

  // For a replacement or void: the payer claim number the provider quoted
  // (837 REF*F8), exactly as sent. It may name an older version, or match
  // nothing; original_claim_id is the link we resolved or set by hand.
  string payer_claim_control_number = 35;
  // The clearinghouse's tracking number for the claim (837 REF*D9).
  string clearinghouse_trace_number = 36;
  // The patient as the provider identified them (837: loop 2010CA), when
  // sent apart from the subscriber: a dependent without a member number of
  // their own. Absent when the subscriber is the patient.
  SubmittedPerson submitted_patient = 37;
  // The subscriber as the provider identified them (837: loop 2010BA).
  // With submitted_patient, what the member is matched from, and what an
  // examiner searches by when no member matched.
  SubmittedPerson submitted_subscriber = 40;
  // Where in an inbound file the claim came from.
  SourceRecord source_record = 38;
  // For a replacement or void: the original, when it is known rather than
  // matched from payer_claim_control_number. Set when the system creates
  // the version (AdjustClaim, VoidClaim), when the submitter names it by
  // id, or by an examiner. An input to adjudication, like pend_overrides.
  ClaimLink original_link = 39;

  // Output only: set once a replacement or void of this claim is
  // adjudicated, in the same transaction, and only on a claim whose
  // result was already reported (payment released). Unset on the current
  // version. This claim's status and outcome stay as they were.
  SupersededBy superseded_by = 41;

  // The rest of what the claim carried, as sent (837P; see
  // claim_submission.proto). None of it is read by adjudication yet, and
  // all of it is situational.

  // The 837 transaction set the claim arrived in (BHT, loops 1000A and
  // 1000B). The same for every claim in the set.
  SubmittedTransaction submitted_transaction = 42;
  // The coverage the claim was billed under (837: SBR of loop 2000B).
  SubmittedCoverage submitted_coverage = 43;
  // The payer the claim was addressed to (837: loop 2010BB).
  SubmittedPayer submitted_payer = 44;
  // Where the billing provider wants payment sent, when not its own
  // address (837: loop 2010AB).
  common.v1.Address pay_to_address = 45;
  // The plan to be paid instead of the provider, on a subrogation demand
  // (837: loop 2010AC).
  SubmittedPayer pay_to_plan = 46;
  // Place of service for the claim (837: CLM05-1). Each line carries its
  // own when it differs.
  string place_of_service_code = 47;
  // Signature, assignment and release indicators (837: CLM06 to CLM20).
  ClaimIndicators indicators = 48;
  // Accident and employment causes (837: CLM11).
  RelatedCauses related_causes = 49;
  // Claim-level dates other than service dates (837: DTP of loop 2300).
  ClaimDates dates = 50;
  // Supporting paperwork (837: PWK of loop 2300).
  repeated Attachment attachments = 51;
  // Contract terms the provider says apply (837: CN1).
  ContractInformation contract = 52;
  // What the patient has already paid the provider (837: AMT*F5).
  common.v1.Money patient_paid = 53;
  // Reference numbers (837: REF of loop 2300).
  ClaimReferences references = 54;
  // Free-form file information (837: K3).
  repeated string file_information = 55;
  // Claim notes (837: NTE of loop 2300).
  repeated SubmittedNote notes = 56;
  // Ambulance transport (837: CR1 of loop 2300).
  AmbulanceTransport ambulance_transport = 57;
  // Spinal manipulation (837: CR2).
  SpinalManipulation spinal_manipulation = 58;
  // Ambulance certification, vision, homebound and EPSDT conditions
  // (837: CRC of loop 2300).
  repeated ConditionInformation conditions = 59;
  // The code list each diagnosis came from, in the same order as
  // diagnosis_codes (837: HI qualifiers, ABK and ABF for ICD-10-CM, BK and
  // BF for ICD-9-CM).
  repeated string diagnosis_code_qualifiers = 60;
  // Surgical procedures the anesthesia was for (837: HI*BP, BO).
  repeated string anesthesia_procedure_codes = 61;
  // Condition codes (837: HI*BG).
  repeated string condition_codes = 62;
  // What a repricer priced the claim at (837: HCP of loop 2300).
  Repricing repricing = 63;
  // The primary care provider, when sent beside the referring provider
  // (837: loop 2310A, NM1*P3).
  ProviderRef primary_care_provider = 64;
  // Where the services were rendered, when not the billing provider's
  // address (837: loop 2310C).
  ProviderRef service_facility = 65;
  // The supervising provider (837: loop 2310D).
  ProviderRef supervising_provider = 66;
  // Ambulance pick-up location (837: loop 2310E).
  AmbulanceLocation ambulance_pickup = 67;
  // Ambulance drop-off location (837: loop 2310F).
  AmbulanceLocation ambulance_dropoff = 68;
  // Other payers on the claim and what they did with it (837: loop 2320).
  repeated OtherInsurance other_insurance = 69;
  // Segments of the claim that intake did not map to a field, exactly as
  // sent, so nothing a provider sends is lost: a segment intake does not
  // know, or one carrying an element it has no field for. Includes such
  // segments from the header and the billing provider, subscriber and
  // patient loops above the claim.
  repeated string unmapped_segments = 70;

  common.v1.AuditInfo audit = 31;

  reserved 29, 30;
}

// SupersededBy names the claim that took another's place.
message SupersededBy {
  // The replacement or void.
  string claim_id = 1;
  // That claim's frequency: REPLACEMENT or VOID.
  ClaimFrequency frequency = 2;
  // When it was adjudicated.
  google.protobuf.Timestamp time = 3;
}

message ClaimLink {
  string claim_id = 1;
  string linked_by = 2;
  google.protobuf.Timestamp linked_time = 3;
  string note = 4;
}

// SubmittedPerson is a subscriber or patient as a claim identified them.
// Every field is as sent.
message SubmittedPerson {
  // The member number sent for the person. An 837 sends it for the
  // subscriber (2010BA NM109) and not for a patient in the 2000C loop.
  string member_number = 1;
  // The person's name (NM1).
  common.v1.PersonName name = 2;
  // The person's date of birth (DMG02).
  common.v1.Date birth_date = 3;
  // F, M or U as sent (DMG03).
  string gender_code = 4;
  // Social Security number, if sent (REF*SY). Never put it in a log, an
  // error or a pend message.
  string ssn = 6;
  // How member_number is qualified (NM108): MI member id, II standard
  // unique health identifier.
  string member_number_qualifier = 7;
  // The person's address (N3, N4).
  common.v1.Address address = 8;
  // The person's relationship to the subscriber: SBR02 for the subscriber
  // (self, when the subscriber is the patient), PAT01 for a patient.
  PatientRelationship relationship = 9;
  // The relationship code as sent.
  string relationship_code = 10;
  // Date of death (PAT06).
  common.v1.Date death_date = 11;
  // Weight in pounds, as sent (PAT08).
  string weight_pounds = 12;
  // Y when the patient is pregnant (PAT09).
  string pregnancy_indicator = 13;
  // Property and casualty claim number (REF*Y4).
  string property_casualty_claim_number = 14;
  // The person's contact for a property and casualty claim (PER).
  SubmittedContact contact = 15;

  reserved 5;
  reserved "card_id", "dependent_loop";
}

// SourceRecord locates a claim in the file it arrived in.
message SourceRecord {
  string ingestion_job_id = 1;
  // ISA13.
  string interchange_control_number = 2;
  // ST02 of the 837 transaction set.
  string transaction_set_control_number = 3;
  // Segment positions in the file (1-based, ISA = 1) of the claim's CLM
  // and of its last segment.
  int32 first_segment = 4;
  int32 last_segment = 5;
}

enum ClaimType {
  CLAIM_TYPE_UNSPECIFIED = 0;
  CLAIM_TYPE_PROFESSIONAL = 1;
  CLAIM_TYPE_INSTITUTIONAL = 2;
  CLAIM_TYPE_DENTAL = 3;
}

enum ClaimFrequency {
  CLAIM_FREQUENCY_UNSPECIFIED = 0;
  CLAIM_FREQUENCY_ORIGINAL = 1;
  CLAIM_FREQUENCY_REPLACEMENT = 7;
  CLAIM_FREQUENCY_VOID = 8;
}

// ClaimStatus is where the claim is in processing. What was decided is
// adjudication.outcome; whether it is still the current version is
// superseded_by; where the money is is payment.
enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  // Saved at intake; adjudication has not completed.
  CLAIM_STATUS_RECEIVED = 1;
  // At least one open pend; see adjudication.pends. The whole claim
  // waits, even when the pend is on one line. Nothing posts to
  // accumulators.
  CLAIM_STATUS_PENDED = 2;
  // No open pends and every line decided. Accumulators post here, once.
  // From here the claim changes only through a replacement or void.
  CLAIM_STATUS_ADJUDICATED = 3;

  reserved 4, 5, 6;
  reserved "CLAIM_STATUS_APPROVED", "CLAIM_STATUS_DENIED", "CLAIM_STATUS_ADJUSTED", "CLAIM_STATUS_VOIDED";
}

// ClaimOutcome is what an adjudication run decided, from its line
// results. Unset on a run that pended.
enum ClaimOutcome {
  CLAIM_OUTCOME_UNSPECIFIED = 0;
  // Every line payable. Says nothing about the amount: the plan may pay
  // zero when the allowed amount is all member cost share.
  CLAIM_OUTCOME_APPROVED = 1;
  // At least one line payable and at least one denied.
  CLAIM_OUTCOME_PARTIALLY_DENIED = 2;
  // Every line denied.
  CLAIM_OUTCOME_DENIED = 3;
  // A void (frequency 8): it cancels its original and decides no lines.
  CLAIM_OUTCOME_VOID = 4;
}

enum ClaimSource {
  CLAIM_SOURCE_UNSPECIFIED = 0;
  CLAIM_SOURCE_EDI_837 = 1;
  CLAIM_SOURCE_PAPER = 2;
  // Keyed into our portal by a provider or member.
  CLAIM_SOURCE_PORTAL = 3;

  // Claims are not taken through a payer-specific API: electronic claims
  // are 837s.
  reserved 4;
  reserved "CLAIM_SOURCE_API";
}

// ProviderRef is a provider as identified on the claim, plus the internal
// provider id once resolved.
message ProviderRef {
  string npi = 1;
  string tin = 2;
  string name = 3;
  string taxonomy_code = 4;
  // Resolved by provider lookup during adjudication.
  string provider_id = 5;

  // The rest is as sent, and situational.

  // 1 for a person, 2 for an organization (NM102).
  string entity_type_code = 6;
  // A person's name in parts (NM103 to NM107). `name` holds it joined, or
  // the organization's name.
  common.v1.PersonName person_name = 7;
  // The provider's address (N3, N4).
  common.v1.Address address = 8;
  // The provider's contacts (PER).
  repeated SubmittedContact contacts = 9;
  // How `tin` is qualified: EI employer identification number, SY Social
  // Security number. When SY, treat `tin` like an SSN: never put it in a
  // log, an error or a pend message.
  string tax_id_qualifier = 10;
  // Other identifiers (REF), e.g. 0B state license, 1G UPIN, G2 commercial
  // number, LU location number.
  repeated SubmittedId secondary_ids = 11;
}

message InstitutionalInfo {
  // Type of bill, e.g. "0111" inpatient hospital admit-through-discharge.
  string type_of_bill = 1;
  common.v1.Date admission_date = 2;
  common.v1.Date discharge_date = 3;
  string admission_type_code = 4;
  string discharge_status_code = 5;
  // MS-DRG, when billed or assigned by grouper.
  string drg = 6;
}

message ClaimLine {
  int32 line_number = 1;
  string procedure_code = 2;
  repeated string modifiers = 3;
  // Institutional lines.
  string revenue_code = 4;
  common.v1.DateRange service_dates = 5;
  string place_of_service_code = 6;
  // Units, in thousandths (1000 = 1 unit) to allow anesthesia minutes and
  // fractional drug units.
  int64 units_milli = 7;
  common.v1.Money charge = 8;
  // 1-based indexes into Claim.diagnosis_codes.
  repeated int32 diagnosis_pointers = 9;
  // NDC for drug lines.
  string ndc = 10;

  LineAdjudication adjudication = 11;

  // The rest of what the line carried, as sent (837P loop 2400; see
  // claim_submission.proto). None of it is read by adjudication yet, and
  // all of it is situational.

  // The code list procedure_code came from (SV101-1): HC HCPCS/CPT, ER
  // Jurisdiction Specific Procedure and Supply Codes, IV HIEC, WK advanced
  // billing concepts.
  string procedure_code_qualifier = 12;
  // The provider's description of the service (SV101-7), required for
  // not-otherwise-classified codes.
  string procedure_description = 13;
  // What units_milli counts (SV103): UN units, MJ minutes.
  string unit_basis_code = 14;
  // Y when the service was an emergency (SV109).
  string emergency_indicator = 15;
  // Y when the service was EPSDT (SV111).
  string epsdt_indicator = 16;
  // Y when the service was family planning (SV112).
  string family_planning_indicator = 17;
  // 0 when the patient is exempt from copay (SV115).
  string copay_status_code = 18;
  // Durable medical equipment rental or purchase terms (SV5).
  DurableMedicalEquipment dme = 19;
  // Supporting paperwork for the line (PWK).
  repeated Attachment attachments = 20;
  // Ambulance transport for the line (CR1).
  AmbulanceTransport ambulance_transport = 21;
  // Durable medical equipment certification (CR3).
  DmeCertification dme_certification = 22;
  // Ambulance certification, hospice employee and DME conditions (CRC).
  repeated ConditionInformation conditions = 23;
  // Line dates other than service dates (DTP).
  LineDates dates = 24;
  // Number of patients in the ambulance, as sent (QTY*PT).
  string ambulance_patient_count = 25;
  // Additional obstetric anesthesia units, as sent (QTY*FL).
  string obstetric_anesthesia_units = 26;
  // Test results (MEA).
  repeated TestResult test_results = 27;
  // Contract terms the provider says apply to the line (CN1).
  ContractInformation contract = 28;
  // Reference numbers (REF).
  LineReferences references = 29;
  // Sales tax on the line (AMT*T).
  common.v1.Money sales_tax = 30;
  // Postage claimed (AMT*F4).
  common.v1.Money postage_claimed = 31;
  // Free-form file information (K3).
  repeated string file_information = 32;
  // Line notes, including third party organization notes (NTE).
  repeated SubmittedNote notes = 33;
  // A service bought from another provider (PS1).
  PurchasedService purchased_service = 34;
  // What a repricer priced the line at (HCP).
  Repricing repricing = 35;
  // Drug quantity and prescription (loop 2410). The NDC is `ndc`.
  LineDrug drug = 36;
  // Providers for this line, when they differ from the claim's (loops
  // 2420A to F): rendering, purchased service, service facility,
  // supervising, ordering, referring and primary care.
  ProviderRef rendering_provider = 37;
  // Who a purchased service was bought from (loop 2420B).
  ProviderRef purchased_service_provider = 38;
  // Where the line's service was rendered (loop 2420C).
  ProviderRef service_facility = 39;
  // The line's supervising provider (loop 2420D).
  ProviderRef supervising_provider = 40;
  // The provider who ordered the service or item (loop 2420E).
  ProviderRef ordering_provider = 41;
  // The line's referring provider (loop 2420F, NM1*DN).
  ProviderRef referring_provider = 42;
  // The line's primary care provider (loop 2420F, NM1*P3).
  ProviderRef primary_care_provider = 43;
  // Ambulance pick-up location for the line (loop 2420G).
  AmbulanceLocation ambulance_pickup = 44;
  // Ambulance drop-off location for the line (loop 2420H).
  AmbulanceLocation ambulance_dropoff = 45;
  // What other payers did with this line (loop 2430).
  repeated OtherPayerLineAdjudication other_payer_adjudications = 46;
  // Supporting forms and their answers (loop 2440).
  repeated FormIdentification forms = 47;
}

// ClaimPayment is the claim's copy of its payment and remittance, owned and
// updated by the payment system. Every adjudicated claim that is not
// reopened first is reported on a remittance, including denials and other
// zero-pay claims: for those,
// `paid` is zero and the state stops at ISSUED.
message ClaimPayment {
  // Amount issued to the payee for this claim.
  common.v1.Money paid = 1;
  // Issue date (check date / EFT effective date).
  common.v1.Date paid_date = 2;
  // The remittance (835) the claim was reported on.
  string remittance_id = 3;
  // Check number or EFT trace number. Replaced when a payment is reissued.
  string payment_trace_number = 4;
  PaymentState state = 5;
}

enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  // Selected into a payment run that has not been released. Nothing has
  // been reported yet: the claim can still be reopened, which takes it
  // out of the run.
  PAYMENT_STATE_SELECTED = 1;
  // Run released: file sent to the bank or check printed, and the 835
  // sent. From here the result has been reported: the claim changes only
  // through a replacement or void. A reissued payment returns to this
  // state.
  PAYMENT_STATE_ISSUED = 2;
  // EFT settled or check cashed.
  PAYMENT_STATE_CLEARED = 3;
  // EFT returned by the bank; the payee holds nothing until reissue.
  PAYMENT_STATE_RETURNED = 4;
  // Stop-payment succeeded or check went stale; the payee holds nothing.
  PAYMENT_STATE_VOIDED = 5;
}

// PendOverride records an examiner clearing a pend. Only pends that are a
// judgment call can be overridden (prior auth, possible duplicate); pends
// caused by missing data (eligibility, pricing, benefit match) come back
// until the data is fixed.
message PendOverride {
  string code = 1;
  // 0 for a claim-level pend.
  int32 line_number = 2;
  string note = 3;
  string resolved_by = 4;
  google.protobuf.Timestamp resolved_time = 5;
}

// Adjudication is the outcome of one run of a claim through the engine.
message Adjudication {
  google.protobuf.Timestamp adjudicated_time = 1;
  // 1 for the first run, incremented by each ReprocessClaim.
  int32 run_number = 2;
  // Why this run happened; empty for the first run.
  string reason = 3;

  // Plan and coverage the claim was adjudicated against.
  string plan_id = 4;
  int32 plan_version = 5;
  string coverage_span_id = 6;
  string network_tier_id = 7;

  common.v1.Money total_allowed = 8;
  common.v1.Money total_paid = 9;
  common.v1.Money total_member_responsibility = 10;

  repeated Pend pends = 11;
  // The accumulator postings this result implies. They are applied only
  // when the claim is adjudicated, and only if the family's accumulator
  // record is still at family_accumulators_revision; otherwise cost
  // sharing is recalculated against the current balances.
  repeated AccumulatorPosting accumulator_postings = 12;
  // Engine version / rules hash, so a decision can be reproduced.
  string engine_version = 13;
  // The FamilyAccumulators record cost sharing was
  // calculated against, and its audit.revision at that time.
  string family_accumulators_id = 14;
  int64 family_accumulators_revision = 15;

  // What this run matched the submitted claim to.
  string customer_id = 16;
  string member_id = 17;
  string original_claim_id = 18;
  OriginalMatch original_match = 19;

  // What this run decided. Output only, derived from the lines' statuses.
  ClaimOutcome outcome = 20;
}

// How a replacement or void was matched to its original.
enum OriginalMatch {
  ORIGINAL_MATCH_UNSPECIFIED = 0;
  // Not matched (or not a replacement or void).
  ORIGINAL_MATCH_NONE = 1;
  // From Claim.original_link.
  ORIGINAL_MATCH_LINKED = 2;
  // From the claim number the provider quoted (REF*F8), resolved to the
  // claim's current version.
  ORIGINAL_MATCH_QUOTED_NUMBER = 3;
}

// LineAdjudication explains how one line was decided, step by step. Every
// line must balance:
//
//   charge  = pricing.allowed + contractual reductions
//   allowed = paid + sum(cost_shares)           (payable lines)
//   charge - paid = sum(cas_adjustments)
message LineAdjudication {
  LineStatus status = 1;
  // Set when status is DENIED.
  Denial denial = 2;
  common.v1.Money charge = 3;
  Pricing pricing = 4;
  BenefitApplied benefit = 5;
  // Member cost sharing, in the order it was applied.
  repeated CostShareApplied cost_shares = 6;
  // Sum of cost_shares.
  common.v1.Money member_responsibility = 7;
  common.v1.Money paid = 8;

  // The 835 CAS view of this line, derived from the fields above.
  repeated CasAdjustment cas_adjustments = 9;
  // RARC remark codes, e.g. "N130".
  repeated string remark_codes = 10;
}

enum LineStatus {
  LINE_STATUS_UNSPECIFIED = 0;
  LINE_STATUS_PAYABLE = 1;
  LINE_STATUS_DENIED = 2;
  LINE_STATUS_PENDED = 3;
}

message Denial {
  // Machine code, e.g. "NOT_COVERED", "NO_ELIGIBILITY", "DUPLICATE",
  // "TIMELY_FILING".
  string code = 1;
  string message = 2;
  // Whether the member may be billed for the denied amount (PR) or the
  // provider must write it off (CO).
  bool member_liable = 3;
}

// Pricing records how the allowed amount was determined.
message Pricing {
  PricingSource source = 1;
  common.v1.Money allowed = 2;

  // For CONTRACT: the contract and the term that priced the line.
  string contract_id = 3;
  int32 contract_term_index = 4;
  provider.v1.ContractMethod contract_method = 5;
  string fee_schedule_id = 6;

  // For NON_CONTRACTED: the tier's basis that was applied.
  plan.v1.ReimbursementBasis non_contracted_basis = 7;
}

enum PricingSource {
  PRICING_SOURCE_UNSPECIFIED = 0;
  PRICING_SOURCE_CONTRACT = 1;
  PRICING_SOURCE_NON_CONTRACTED = 2;
}

// BenefitApplied records which plan benefit covered the line.
message BenefitApplied {
  string service_category_id = 1;
  string network_tier_id = 2;
  // The cost share rule as it was on the plan version used.
  plan.v1.CostShare cost_share = 3;
}

message CostShareApplied {
  CostShareType type = 1;
  common.v1.Money amount = 2;
  // Accumulators this amount counts toward (e.g. the individual and
  // family deductible).
  repeated string accumulator_ids = 3;
}

enum CostShareType {
  COST_SHARE_TYPE_UNSPECIFIED = 0;
  COST_SHARE_TYPE_DEDUCTIBLE = 1;
  COST_SHARE_TYPE_COPAY = 2;
  COST_SHARE_TYPE_COINSURANCE = 3;
}

// CasAdjustment mirrors an 835 CAS (claim adjustment segment) entry.
message CasAdjustment {
  CasGroup group = 1;
  // CARC reason code, e.g. "45" (charge exceeds fee schedule), "1"
  // (deductible), "2" (coinsurance), "3" (copay).
  string reason_code = 2;
  common.v1.Money amount = 3;
}

enum CasGroup {
  CAS_GROUP_UNSPECIFIED = 0;
  // CO: contractual obligation (provider write-off).
  CAS_GROUP_CONTRACTUAL = 1;
  // PR: patient responsibility.
  CAS_GROUP_PATIENT_RESPONSIBILITY = 2;
  // OA: other adjustment.
  CAS_GROUP_OTHER = 3;
  // PI: payer initiated reduction.
  CAS_GROUP_PAYER_INITIATED = 4;
}

message Pend {
  // Machine code, e.g. "NO_ELIGIBILITY", "PROVIDER_NOT_FOUND",
  // "PRIOR_AUTH_REQUIRED", "NO_BENEFIT_MATCH", "COB_REVIEW",
  // "HIGH_DOLLAR".
  string code = 1;
  string message = 2;
  // 0 when the pend applies to the whole claim.
  int32 line_number = 3;
  google.protobuf.Timestamp resolved_time = 4;
  string resolved_by = 5;
  string resolution_note = 6;
}

message AccumulatorPosting {
  string accumulator_id = 1;
  // member_id for INDIVIDUAL accumulators, subscriber_id for FAMILY.
  string owner_id = 2;
  int32 line_number = 3;
  common.v1.Money amount = 4;
}
