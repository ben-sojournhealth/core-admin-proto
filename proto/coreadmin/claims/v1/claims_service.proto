syntax = "proto3";

package coreadmin.claims.v1;

import "coreadmin/claims/v1/claims.proto";
import "coreadmin/common/v1/common.proto";

service ClaimsService {
  // ProcessClaim accepts a new claim, saves it and adjudicates it before
  // returning. The result is PENDED or ADJUDICATED (what was decided is
  // adjudication.outcome); a claim is left RECEIVED only if it was saved
  // and adjudication did not complete. A
  // provider's corrected claim (frequency 7) or void (frequency 8) also
  // arrives here and is handled as AdjustClaim / VoidClaim of the claim it
  // references.
  //
  // Calls for the same family are safe in any order and concurrently: the
  // accumulator revision check makes the loser recalculate. Callers
  // sending batches should still send one subscriber's claims in order, to
  // keep recalculation rare.
  rpc ProcessClaim(ProcessClaimRequest) returns (ProcessClaimResponse);
  rpc GetClaim(GetClaimRequest) returns (GetClaimResponse);
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse);

  // ReprocessClaim re-runs adjudication on a PENDED claim, after an
  // examiner clears pends or the underlying data changes. Rejected for any
  // other status: an adjudicated claim is reopened first (ReopenClaim) if
  // its payment has not been released, and otherwise changes only through
  // AdjustClaim or VoidClaim. The previous result moves to adjudication_history.
  rpc ReprocessClaim(ReprocessClaimRequest) returns (ReprocessClaimResponse);

  // ReopenClaim puts an adjudicated claim back to PENDED so it can be
  // re-run in place, with the same claim number and no new version. Only
  // for a claim whose payment has not been released: nothing has been
  // reported, so there is nothing to reverse. A claim selected into an
  // unreleased payment run is taken out of it.
  //
  // The claim's accumulator postings are reversed, its current result
  // moves to adjudication_history, and it carries a REOPENED pend with
  // the reason given. ReprocessClaim then re-runs it against current data.
  // Rejected once the payment run is released: use AdjustClaim or
  // VoidClaim.
  rpc ReopenClaim(ReopenClaimRequest) returns (ReopenClaimResponse);

  // AdjustClaim corrects an adjudicated claim whose payment has been
  // released, by creating a replacement claim that references it. The
  // replacement's cost sharing is calculated against the family's balances
  // as if the original had never posted. When the replacement is
  // adjudicated, the original's postings are reversed and the
  // replacement's posted in one write, and the original's superseded_by is
  // set. The next 835 reverses what was reported for the original and
  // reports the replacement.
  //
  // If the replacement's accumulator postings differ from the original's,
  // claims for the same subscriber unit and benefit period that were
  // adjudicated after the original were decided against balances that no
  // longer hold. Those claims are not changed, and nothing detects or
  // records that today: what should is still to be designed.
  //
  // Rejected before the original's payment is released: reopen it
  // instead. PreviewAdjustment answers what this would do, without doing
  // it.
  rpc AdjustClaim(AdjustClaimRequest) returns (AdjustClaimResponse);

  // VoidClaim cancels an adjudicated claim whose payment has been
  // released, by creating a void (frequency 8) that references it. The
  // void claim is adjudicated on creation with outcome VOID and nothing
  // paid, so the next remittance reports the reversal and recovers
  // anything paid on the original. The original's superseded_by is set,
  // its accumulator postings are reversed, and later claims are left as
  // they are, as for AdjustClaim. Rejected before the original's payment
  // is released.
  rpc VoidClaim(VoidClaimRequest) returns (VoidClaimResponse);

  // The three operations below calculate and save nothing: no claim, no
  // claim number, no accumulator postings. Each answers what one of the
  // operations above would do. An answer reflects eligibility, pricing and
  // accumulator balances at the moment it is asked; it is not a promise.

  // EstimateClaim adjudicates a claim that is not in the system, as
  // ProcessClaim would if it were submitted now.
  rpc EstimateClaim(EstimateClaimRequest) returns (EstimateClaimResponse);

  // PreviewReadjudication answers how an existing claim would be decided
  // if it were run again now, for a claim whose result has not been
  // reported: a PENDED claim (what ReprocessClaim would give, with the
  // resolutions supplied), or an adjudicated claim whose payment has not
  // been released (what ReopenClaim followed by ReprocessClaim would
  // give). The claim is run as submitted, and as if it had posted nothing
  // to the accumulators itself. Rejected for a claim whose payment has
  // been released: use PreviewAdjustment.
  rpc PreviewReadjudication(PreviewReadjudicationRequest) returns (PreviewReadjudicationResponse);

  // PreviewAdjustment answers what AdjustClaim would do to a claim whose
  // payment has been released: the replacement as it would be decided,
  // and the delta against what the payee holds. Rejected for a claim
  // whose payment has not been released: use PreviewReadjudication.
  rpc PreviewAdjustment(PreviewAdjustmentRequest) returns (PreviewAdjustmentResponse);
}

message ProcessClaimRequest {
  Claim claim = 1;

  reserved 2;
}

message ProcessClaimResponse {
  Claim claim = 1;
}

message GetClaimRequest {
  string id = 1;
}

message GetClaimResponse {
  Claim claim = 1;
}

message ListClaimsRequest {
  string customer_id = 1;
  // Optional filters.
  string member_id = 2;
  ClaimStatus status = 3;
  common.v1.DateRange service_dates = 4;
  common.v1.PageRequest page = 5;
  // All claims for one subscriber unit.
  string subscriber_id = 6;
  PaymentState payment_state = 7;

  reserved 8;
}

message ListClaimsResponse {
  repeated Claim claims = 1;
  common.v1.PageResponse page = 2;
}

message ReprocessClaimRequest {
  string claim_id = 1;
  // Pends the examiner is clearing. Empty when re-running because
  // underlying data changed (eligibility, fee schedule).
  repeated PendResolution resolutions = 2;
  // Required. Recorded on the new adjudication run.
  string reason = 3;

  reserved 4;
}

message PendResolution {
  string code = 1;
  // 0 for a claim-level pend.
  int32 line_number = 2;
  string note = 3;
}

message ReprocessClaimResponse {
  Claim claim = 1;
}

message AdjustClaimRequest {
  string original_claim_id = 1;
  // The claim as it should have been. Leave unset to re-adjudicate the
  // original's content unchanged against current data (e.g. after a fee
  // schedule or eligibility correction).
  Claim corrected_claim = 2;
  // Required.
  string reason = 3;

  reserved 4;
}

message AdjustClaimResponse {
  // The replacement claim.
  Claim claim = 1;
  AdjustmentDelta delta = 2;

  reserved 3;
}

// AdjustmentDelta compares a replacement claim with what the payee holds
// for the original.
message AdjustmentDelta {
  DeltaBasis basis = 1;
  // What the payee holds for the original, per `basis`.
  common.v1.Money original_paid = 2;
  common.v1.Money projected_paid = 3;
  // projected_paid - original_paid. Negative is a recovery.
  common.v1.Money delta = 4;
  // Per-line comparison of the two adjudication results, matched by line
  // number. A line present on one side only has zero on the other.
  repeated LineDelta lines = 5;
}

enum DeltaBasis {
  DELTA_BASIS_UNSPECIFIED = 0;
  // Original's payment is issued or cleared: measured against
  // payment.paid, which is zero for a denied or zero-pay claim.
  DELTA_BASIS_PAYMENT = 1;
  // Original's payment was returned or voided and not reissued: the payee
  // holds nothing, so measured against zero.
  DELTA_BASIS_PAYMENT_NOT_HELD = 3;

  reserved 2, 4;
}

message LineDelta {
  int32 line_number = 1;
  common.v1.Money original_paid = 2;
  common.v1.Money projected_paid = 3;
  common.v1.Money delta = 4;
}

message VoidClaimRequest {
  string claim_id = 1;
  // Required.
  string reason = 2;
}

message VoidClaimResponse {
  // The new void claim.
  Claim void_claim = 1;

  reserved 2;
}

message ReopenClaimRequest {
  string claim_id = 1;
  // Required. Recorded on the REOPENED pend.
  string reason = 2;
}

message ReopenClaimResponse {
  Claim claim = 1;
}

message EstimateClaimRequest {
  Claim claim = 1;
}

message EstimateClaimResponse {
  // The claim as it would be adjudicated. It has no claim number.
  Claim claim = 1;
}

message PreviewReadjudicationRequest {
  string claim_id = 1;
  // For a PENDED claim: pends to treat as cleared by an examiner.
  repeated PendResolution resolutions = 2;
}

message PreviewReadjudicationResponse {
  // The claim as it would be decided now. The stored claim is unchanged.
  Claim claim = 1;
}

message PreviewAdjustmentRequest {
  string original_claim_id = 1;
  // The claim as it should have been. Leave unset to re-adjudicate the
  // original's content unchanged against current data.
  Claim corrected_claim = 2;
}

message PreviewAdjustmentResponse {
  // The replacement claim as it would be decided.
  Claim claim = 1;
  AdjustmentDelta delta = 2;
}
