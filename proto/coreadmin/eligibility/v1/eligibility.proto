syntax = "proto3";

package coreadmin.eligibility.v1;

import "coreadmin/common/v1/common.proto";

// Member is a covered person. Every member belongs to a subscriber unit
// (the employee plus dependents); the subscriber's own Member record has
// relationship SELF and subscriber_id == id.
message Member {
  string id = 1;
  string customer_id = 2;
  string subscriber_id = 3;
  Relationship relationship = 4;
  common.v1.PersonName name = 5;
  common.v1.Date birth_date = 6;
  common.v1.Gender gender = 7;
  common.v1.Address address = 8;
  // Member id printed on the ID card. Unique within a customer.
  string card_id = 9;
  repeated common.v1.ExternalId external_ids = 10;
  repeated CoverageSpan coverage = 11;
  // Social Security number, when the sponsor sent one (834: NM109 with
  // NM108 = 34). Never put it in a log, an error or a pend message.
  string ssn = 12;
  common.v1.AuditInfo audit = 15;
}

enum Relationship {
  RELATIONSHIP_UNSPECIFIED = 0;
  RELATIONSHIP_SELF = 1;
  RELATIONSHIP_SPOUSE = 2;
  RELATIONSHIP_DOMESTIC_PARTNER = 3;
  RELATIONSHIP_CHILD = 4;
  RELATIONSHIP_OTHER_DEPENDENT = 5;
}

// CoverageSpan is a contiguous period during which a member is enrolled in
// a plan. Spans for the same member must not overlap within a
// coverage line (medical, dental, ...). Retroactive terminations shorten
// `effective.end`; they never delete the span, so claims paid during the
// span can be identified for recovery.
message CoverageSpan {
  string id = 1;
  string plan_id = 2;
  string group_id = 3;
  CoverageLine line = 4;
  CoverageTier tier = 5;
  common.v1.DateRange effective = 6;
  CoverageStatus status = 7;
  // Paid-through date for premium/funding; claims after this date may pend
  // during a grace period.
  common.v1.Date paid_through = 8;
  // COBRA continuation, if applicable.
  bool cobra = 9;
  // The enrollment transaction that created or last changed this span.
  string source_ingestion_job_id = 10;
}

enum CoverageLine {
  COVERAGE_LINE_UNSPECIFIED = 0;
  COVERAGE_LINE_MEDICAL = 1;
  COVERAGE_LINE_PHARMACY = 2;
  COVERAGE_LINE_DENTAL = 3;
  COVERAGE_LINE_VISION = 4;
}

// CoverageTier is the subscriber's elected tier. Drives premium/funding and
// stop-loss aggregate attachment factors.
enum CoverageTier {
  COVERAGE_TIER_UNSPECIFIED = 0;
  COVERAGE_TIER_EMPLOYEE = 1;
  COVERAGE_TIER_EMPLOYEE_SPOUSE = 2;
  COVERAGE_TIER_EMPLOYEE_CHILDREN = 3;
  COVERAGE_TIER_FAMILY = 4;
}

enum CoverageStatus {
  COVERAGE_STATUS_UNSPECIFIED = 0;
  COVERAGE_STATUS_ACTIVE = 1;
  COVERAGE_STATUS_TERMINATED = 2;
  // In a premium grace period: claims pend rather than pay.
  COVERAGE_STATUS_GRACE = 3;
  COVERAGE_STATUS_SUSPENDED = 4;
}
