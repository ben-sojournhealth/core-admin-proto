syntax = "proto3";

package coreadmin.plan.v1;

import "coreadmin/common/v1/common.proto";
import "coreadmin/plan/v1/plan.proto";

service PlanService {
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  // ResolvePlanVersion returns the plan version in force on a date.
  rpc ResolvePlanVersion(ResolvePlanVersionRequest) returns (ResolvePlanVersionResponse);
}

message GetPlanRequest {
  string id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {
  string customer_id = 1;
  common.v1.PageRequest page = 2;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  common.v1.PageResponse page = 2;
}

message CreatePlanRequest {
  Plan plan = 1;
}

message CreatePlanResponse {
  Plan plan = 1;
}

message UpdatePlanRequest {
  Plan plan = 1;
}

message UpdatePlanResponse {
  Plan plan = 1;
}

message ResolvePlanVersionRequest {
  string plan_id = 1;
  common.v1.Date as_of = 2;
}

message ResolvePlanVersionResponse {
  Plan plan = 1;
  PlanVersion version = 2;
}
