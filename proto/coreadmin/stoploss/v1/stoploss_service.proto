syntax = "proto3";

package coreadmin.stoploss.v1;

import "coreadmin/common/v1/common.proto";
import "coreadmin/stoploss/v1/stoploss.proto";

service StopLossService {
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);

  // ListSpecificExposures returns members' exposure on a policy, largest
  // first. Use min_eligible_paid to find large claimants.
  rpc ListSpecificExposures(ListSpecificExposuresRequest) returns (ListSpecificExposuresResponse);
  rpc GetAggregateExposure(GetAggregateExposureRequest) returns (GetAggregateExposureResponse);

  rpc CreateFiling(CreateFilingRequest) returns (CreateFilingResponse);
  rpc UpdateFiling(UpdateFilingRequest) returns (UpdateFilingResponse);
  rpc ListFilings(ListFilingsRequest) returns (ListFilingsResponse);
}

message GetPolicyRequest {
  string id = 1;
}

message GetPolicyResponse {
  StopLossPolicy policy = 1;
}

message ListPoliciesRequest {
  string customer_id = 1;
  common.v1.PageRequest page = 2;
}

message ListPoliciesResponse {
  repeated StopLossPolicy policies = 1;
  common.v1.PageResponse page = 2;
}

message CreatePolicyRequest {
  StopLossPolicy policy = 1;
}

message CreatePolicyResponse {
  StopLossPolicy policy = 1;
}

message UpdatePolicyRequest {
  StopLossPolicy policy = 1;
}

message UpdatePolicyResponse {
  StopLossPolicy policy = 1;
}

message ListSpecificExposuresRequest {
  string policy_id = 1;
  common.v1.Money min_eligible_paid = 2;
  common.v1.PageRequest page = 3;
}

message ListSpecificExposuresResponse {
  repeated SpecificExposure exposures = 1;
  common.v1.PageResponse page = 2;
}

message GetAggregateExposureRequest {
  string policy_id = 1;
}

message GetAggregateExposureResponse {
  AggregateExposure exposure = 1;
}

message CreateFilingRequest {
  StopLossFiling filing = 1;
}

message CreateFilingResponse {
  StopLossFiling filing = 1;
}

message UpdateFilingRequest {
  StopLossFiling filing = 1;
}

message UpdateFilingResponse {
  StopLossFiling filing = 1;
}

message ListFilingsRequest {
  string policy_id = 1;
  common.v1.PageRequest page = 2;
}

message ListFilingsResponse {
  repeated StopLossFiling filings = 1;
  common.v1.PageResponse page = 2;
}
